const cv=$('c'),ctx=cv.getContext('2d');let W=800,H=450;
function resize(){const r=cv.getBoundingClientRect();W=Math.max(300,Math.floor(r.width));H=Math.max(200,Math.floor(r.height));cv.width=W;cv.height=H}addEventListener('resize',resize);resize();
function draw(){if(!R){ctx.fillStyle='#261c16';ctx.fillRect(0,0,W,H);return}const t=performance.now()/1000;ctx.fillStyle=R.wall;ctx.fillRect(0,0,W,H*0.55);ctx.fillStyle='rgba(0,0,0,0.06)';for(let i=0;i<W;i+=36)ctx.fillRect(i,0,1,H*0.55);

  const order=R.items.map((it,i)=>i).sort((a,b)=>(R.items[a].y)-(R.items[b].y));for(const i of order){const it=R.items[i];drawItem(it,t,i===sel)}}
function drawItem(it,t,selected){const d=ITEMS[it.k];ctx.save();ctx.translate(it.x,it.y);if(!WALL_ITEMS.includes(it.k)){ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(0,2,d.w/2,8,0,0,7);ctx.fill()}ctx.scale(it.flip,1);const c=it.col,w=d.w,h=d.h;ctx.fillStyle=c;
  switch(it.k){case 'bed':ctx.fillStyle='#8a6a4a';ctx.fillRect(-w/2,-h,w,h);ctx.fillStyle=c;ctx.fillRect(-w/2+4,-h+14,w-8,h-24);ctx.fillStyle='#fff';ctx.fillRect(-w/2+10,-h+18,40,22);ctx.fillStyle=shade(c,0.85);ctx.fillRect(-w/2+4,-h+46,w-8,10);break;

    case 'table':ctx.fillRect(-w/2,-h,w,12);ctx.fillStyle=shade(c,0.7);ctx.fillRect(-w/2+6,-h+12,8,h-12);ctx.fillRect(w/2-14,-h+12,8,h-12);break;
    case 'chair':ctx.fillRect(-w/2,-h,w,10);ctx.fillRect(-w/2,-h/2,w,10);ctx.fillStyle=shade(c,0.7);ctx.fillRect(-w/2,-h,6,h);ctx.fillRect(w/2-6,-h/2,6,h/2);ctx.fillRect(-w/2,-h/2,6,h/2);break;

    case 'mirror':ctx.fillStyle='#d0a040';ctx.beginPath();ctx.ellipse(0,-h/2,w/2,h/2,0,0,7);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(0,-h/2,w/2-6,h/2-6,0,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect(-8,-h+14,5,h-28);break;
    case 'fairy':ctx.strokeStyle='#8a7a5a';ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<=10;i++){const x=-w/2+i*w/10,y=-h+Math.sin(i*0.9)*8;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();for(let i=0;i<=10;i++){const x=-w/2+i*w/10,y=-h+Math.sin(i*0.9)*8+6;ctx.fillStyle=['#ffd27a','#ff8fd0','#8ff0a0','#7fe0ff'][i%4];ctx.globalAlpha=0.6+0.4*Math.sin(t*3+i);ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill()}ctx.globalAlpha=1;break}
  ctx.restore();if(selected){ctx.strokeStyle='#ffc078';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.strokeRect(it.x-d.w/2-4,it.y-d.h-4,d.w+8,d.h+12);ctx.setLineDash([])}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.min(255,Math.round(((n>>16)&255)*f)),g=Math.min(255,Math.round(((n>>8)&255)*f)),b=Math.min(255,Math.round((n&255)*f));return 'rgb('+r+','+g+','+b+')'}
const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return [(t.clientX-r.left)*W/r.width,(t.clientY-r.top)*H/r.height]};
function down(x,y){if(!R)return;ac();const i=hitTest(x,y);sel=i;if(i>=0)drag={i,dx:x-R.items[i].x,dy:y-R.items[i].y}}

function show(html){return new Promise(res=>{$('overlay').innerHTML='<div class="modal">'+html+'</div>';$('overlay').classList.add('on');const b=$('ok');if(b)b.onclick=()=>{hide();res()}})}function hide(){$('overlay').classList.remove('on');$('overlay').innerHTML=''}
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
