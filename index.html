<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daniele Bros Games</title>
<meta name="description" content="Play the games made by Daniele Bros — free browser games, no download needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a05;--bg2:#0c1506;--panel:#0f170a;--border:#2a3a18;--border-hi:#e8c84a;
  --khaki:#c8a84b;--gold:#e8c84a;--cream:#ddd5b0;--dim:#8a9a60;--dimmer:#5a7040;
  --red:#e83030;--red-dk:#b81818;
  --font-head:'Oswald','Arial Narrow',Arial,sans-serif;
  --font-mono:'Share Tech Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--cream);font-family:var(--font-mono);
  min-height:100vh;display:flex;flex-direction:column;
  background-image:
    radial-gradient(ellipse at 50% -10%,rgba(200,168,75,.14),transparent 55%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 4px);
}
a{color:inherit;}

/* ---------- header ---------- */
header{
  padding:64px 20px 40px;text-align:center;position:relative;overflow:hidden;
  border-bottom:1px solid var(--border);
}
header::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,14,4,0) 60%,var(--bg) 100%);
}
.eyebrow{font-size:10px;letter-spacing:8px;color:var(--dim);margin-bottom:12px;text-transform:uppercase;}
h1{
  font-family:var(--font-head);font-weight:700;letter-spacing:10px;
  font-size:clamp(40px,8vw,76px);color:var(--gold);line-height:1.05;
  text-shadow:0 0 60px rgba(220,180,40,.45),0 3px 0 rgba(0,0,0,.9);
}
.tagline{font-size:12px;letter-spacing:5px;color:#a0b070;margin-top:14px;text-transform:uppercase;}
.count{
  display:inline-block;margin-top:26px;padding:6px 16px;font-size:10px;letter-spacing:3px;
  color:var(--khaki);border:1px solid var(--border);border-radius:2px;background:rgba(0,0,0,.35);
}

/* ---------- games grid ---------- */
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:48px 20px 64px;}
.section-title{
  display:flex;align-items:center;gap:14px;margin-bottom:24px;
  font-family:var(--font-head);font-size:16px;letter-spacing:6px;color:var(--dim);text-transform:uppercase;
}
.section-title::after{content:"";flex:1;height:1px;background:var(--border);}
#games{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px;}

.card{
  position:relative;display:flex;flex-direction:column;background:var(--panel);
  border:2px solid var(--border);border-radius:6px;overflow:hidden;
  transition:border-color .15s,box-shadow .15s,transform .15s;
}
.card:hover{border-color:var(--border-hi);box-shadow:0 0 34px rgba(232,200,74,.22);transform:translateY(-3px);}
.card-art{
  height:170px;display:flex;align-items:center;justify-content:center;position:relative;
  font-size:64px;line-height:1;
  background:
    radial-gradient(circle at 50% 120%,rgba(232,48,48,.28),transparent 60%),
    linear-gradient(180deg,#152208,#0a1204);
  border-bottom:1px solid var(--border);
}
.card-art::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px);
}
.card-art .badge{
  position:absolute;top:10px;left:10px;font-size:9px;letter-spacing:3px;padding:4px 9px;
  border:1px solid rgba(232,200,74,.5);color:var(--gold);background:rgba(0,0,0,.6);border-radius:2px;
}
.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;flex:1;}
.card h2{font-family:var(--font-head);font-size:26px;letter-spacing:5px;color:var(--gold);line-height:1;}
.card .sub{font-size:11px;letter-spacing:3px;color:#a0b070;text-transform:uppercase;margin-top:-4px;}
.card p{font-size:12px;line-height:1.7;color:var(--cream);opacity:.85;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:9px;letter-spacing:2px;padding:3px 8px;border:1px solid var(--border);color:var(--dim);border-radius:2px;text-transform:uppercase;}
.card-actions{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:6px;flex-wrap:wrap;}
.play{
  flex:1;min-width:140px;text-align:center;text-decoration:none;
  background:linear-gradient(180deg,var(--red),var(--red-dk));color:#fff;
  font-family:var(--font-head);font-weight:700;font-size:18px;letter-spacing:6px;
  padding:12px 22px;border:2px solid #ff5040;border-radius:4px;
  box-shadow:0 0 22px rgba(232,48,48,.45),0 4px 0 #7a0808;transition:transform .12s,box-shadow .12s;
}
.play:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(232,48,48,.65),0 6px 0 #7a0808;}
.play:active{transform:translateY(2px);box-shadow:0 0 18px rgba(232,48,48,.4),0 2px 0 #7a0808;}
.ghost{
  text-decoration:none;font-family:var(--font-head);font-size:12px;letter-spacing:3px;
  color:var(--dim);padding:10px 16px;border:1px solid var(--border);border-radius:2px;transition:color .12s,border-color .12s;
}
.ghost:hover{color:var(--gold);border-color:var(--gold);}

.empty{
  grid-column:1/-1;text-align:center;padding:40px;border:1px dashed var(--border);
  color:var(--dimmer);font-size:11px;letter-spacing:3px;
}

/* ---------- footer ---------- */
footer{
  border-top:1px solid var(--border);padding:22px 20px;text-align:center;
  font-size:10px;letter-spacing:3px;color:var(--dimmer);text-transform:uppercase;
}
footer a{color:var(--dim);text-decoration:none;}
footer a:hover{color:var(--gold);}

@media (max-width:480px){
  header{padding:44px 16px 32px;}
  h1{letter-spacing:6px;}
  .card h2{font-size:22px;letter-spacing:4px;}
}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Daniele Bros presents</div>
  <h1>GAME ARCADE</h1>
  <div class="tagline">Free browser games · No download · Just play</div>
  <div class="count" id="game-count">LOADING…</div>
</header>

<main>
  <div class="section-title">All games</div>
  <div id="games"></div>
</main>

<footer>
  Made by Daniele Bros &nbsp;·&nbsp; <a href="https://github.com/daniele-bros/ironfront">Source on GitHub</a>
</footer>

<script>
/* ============================================================
   GAME LIST — to add a new game, drop its HTML file in this
   folder and add one entry to this array. That's it.
   ============================================================ */
const GAMES = [
  {
    title: 'IRON FRONT',
    subtitle: 'WW2 Tank Combat',
    icon: '💥',
    badge: 'FLAGSHIP',
    url: 'ww2tanks.html',
    description:
      'Top-down tank warfare from the Blitzkrieg to the modern era. Climb a ten-tier tech tree ' +
      'across nine nations plus Cold War and modern-era branches, fight on seven historic maps ' +
      'from Normandy to Stalingrad, and take on anything from a solo duel to a 1-vs-1000 last ' +
      'stand or endless Ratte boss waves. Earn coins, buy mortars and nukes, and call in artillery.',
    tags: ['Action', 'Tanks', 'WW2', '300+ vehicles', '6 modes', 'Keyboard + Mouse'],
    source: 'https://github.com/daniele-bros/ironfront/blob/main/ww2tanks.html'
  },
  {
    title: 'IRON BATTLE',
    subtitle: 'Real-Time Strategy',
    icon: '🗺️',
    badge: 'NEW',
    url: 'command.html',
    description:
      'Command the whole battlefield from a flat tactical map. Recruit rifle squads, spec ops ' +
      'and tanks, stockpile rockets, and call in aircraft. Hold all six objectives and crush the ' +
      'enemy HQ across a 1,000-operation campaign, with a secret target mission every ten battles. ' +
      'Box-select your units, right-click to move, and manage supply that flows faster the more ground you hold.',
    tags: ['Strategy', 'RTS', 'Campaign', 'Troops + Tanks + Air', 'Mouse'],
    source: 'https://github.com/daniele-bros/ironfront/blob/main/command.html'
  },
  {
    title: 'IRONCRAFT',
    subtitle: 'Voxel Survival',
    icon: '⛏️',
    badge: 'NEW',
    url: 'minecraft.html',
    description:
      'A Minecraft-style survival sandbox in your browser. Infinite procedurally generated worlds ' +
      'with ten biomes, caves, ores, villages, strongholds and mansions. Mine, craft with real ' +
      'recipes, smelt, enchant, tame wolves, ride horses, fight creepers and endermen, then brave ' +
      'the Nether and the End to slay the Ender Dragon and the Wither. Random Drops mode for chaos.',
    tags: ['Survival', 'Sandbox', '3D · WebGL2', 'Desktop only', 'Keyboard + Mouse'],
    source: 'https://github.com/daniele-bros/ironfront/blob/main/minecraft.html'
  }
  // { title:'NEXT GAME', subtitle:'…', icon:'🎮', url:'nextgame.html', description:'…', tags:[] },
];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function render(){
  const grid=document.getElementById('games');
  if(!GAMES.length){
    grid.innerHTML='<div class="empty">NO GAMES YET — CHECK BACK SOON</div>';
  }else{
    grid.innerHTML=GAMES.map(g=>`
      <article class="card">
        <div class="card-art">
          ${g.badge?`<span class="badge">${esc(g.badge)}</span>`:''}
          <span aria-hidden="true">${g.icon||'🎮'}</span>
        </div>
        <div class="card-body">
          <h2>${esc(g.title)}</h2>
          ${g.subtitle?`<div class="sub">${esc(g.subtitle)}</div>`:''}
          <p>${esc(g.description||'')}</p>
          ${g.tags&&g.tags.length?`<div class="tags">${g.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
          <div class="card-actions">
            <a class="play" href="${esc(g.url)}">⚔ PLAY</a>
            ${g.source?`<a class="ghost" href="${esc(g.source)}" target="_blank" rel="noopener">SOURCE</a>`:''}
          </div>
        </div>
      </article>`).join('');
  }
  const n=GAMES.length;
  document.getElementById('game-count').textContent=`${n} GAME${n===1?'':'S'} · MORE COMING`;
}
render();
</script>
</body>
</html>
