  $('box').innerHTML=(won?'<h1>VICTORY</h1><h2>LAST ONE STANDING</h2>':'<h1>#'+me.place+' OF '+N_PLAYERS+'</h1><h2>KNOCKED OUT</h2>')+'<p>You knocked '+me.kills+' player'+(me.kills===1?'':'s')+'.'+(won?' The island is yours.':' Grab a gun faster next time, and watch the storm.')+'</p><button class="btn" id="again">PLAY AGAIN</button> <button class="btn" id="menu">TITLE</button>';
  $('msg').style.display='flex';$('again').onclick=start;$('menu').onclick=titleScreen}
function start(){const bx=$('box');bx.innerHTML='<h1>DROPPING IN</h1><h2>BUILDING THE ISLAND</h2><p>100 players, sixty towns, three airfields and a lot of trees. One moment.</p>';$('msg').style.display='flex';beep(520,0.1,'triangle');setTimeout(()=>{G=newGame();$('msg').style.display='none';hud()},30)}
// ---------- input ----------
let lastW=0;addEventListener('keydown',e=>{if(e.code==='AltLeft'||e.code==='AltRight'||e.code==='Space'||e.code==='Tab')e.preventDefault();if(e.repeat)return;keys[e.code]=true;if(!G||G.phase!=='play'||G.over)return;const me=G.me;
  if(e.code==='KeyW'){const now=performance.now();if(now-lastW<320)me.sprintTap=true;lastW=now}
  if(e.code==='KeyE')toggleVehicle(me);if(me.vehicle){if(e.code==='Space')vehFire(me.vehicle,me);return}if(e.code==='KeyR')startReload(me);if(e.code==='KeyX')dropGun(me);if(e.code==='KeyQ')build(me);if(e.code==='KeyF')eat(me);if(e.code==='KeyG')drink(me);if(/^Digit[1-5]$/.test(e.code))me.sel=+e.code[5]-1;if(e.code==='Space')jump(me)});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='AltLeft'||e.code==='AltRight')e.preventDefault();if(e.code==='KeyW'&&G&&G.me)G.me.sprintTap=false});
function pointerLocked(){return document.pointerLockElement===cv}
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(pointerLocked()&&G){const k=G.fovK||1;G.cam.yaw+=(e.movementX||0)*0.0028*k;G.cam.pitch=clamp(G.cam.pitch-(e.movementY||0)*0.0022*k,-1.2,1.0)}});
cv.addEventListener('mousedown',e=>{if(e.button===0){mouse.down=true;mouse.fired=false;mouse.clickQ=0.25;if(G&&!pointerLocked()&&cv.requestPointerLock){try{cv.requestPointerLock()}catch(x){}}}if(e.button===2&&G&&G.me&&!G.me.vehicle)build(G.me)});addEventListener('mouseup',()=>{mouse.down=false;mouse.fired=false});cv.addEventListener('contextmenu',e=>e.preventDefault());
ov.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{if(!G)return;const me=G.me;me.sel=(me.sel+(e.deltaY>0?1:4))%5});
// touch: left half joystick, right half aim + fire
const touch={move:null,look:false,fire:false,ids:{},jump:false,aim:false};
cv.addEventListener('touchstart',e=>{$('touch').style.display='block';for(const t of e.changedTouches){if(t.clientX<W/2)touch.ids[t.identifier]={kind:'move',x0:t.clientX,y0:t.clientY};else{touch.ids[t.identifier]={kind:'look',lx:t.clientX};touch.look=true}}e.preventDefault()},{passive:false});
cv.addEventListener('touchmove',e=>{for(const t of e.changedTouches){const s=touch.ids[t.identifier];if(!s)continue;if(s.kind==='move'){const dx=t.clientX-s.x0,dy=t.clientY-s.y0;const l=Math.hypot(dx,dy);touch.move={x:dx/Math.max(40,l),y:dy/Math.max(40,l)}}else if(G){G.cam.yaw+=(t.clientX-s.lx)*0.008;G.cam.pitch=clamp(G.cam.pitch-(t.clientY-(s.ly===undefined?t.clientY:s.ly))*0.006,-1.2,1.0);s.lx=t.clientX;s.ly=t.clientY}}e.preventDefault()},{passive:false});
const tEnd=e=>{for(const t of e.changedTouches){const s=touch.ids[t.identifier];if(!s)continue;if(s.kind==='move')touch.move=null;else touch.look=false;delete touch.ids[t.identifier]}};
cv.addEventListener('touchend',tEnd);cv.addEventListener('touchcancel',tEnd);
$('tFire').ontouchstart=e=>{e.preventDefault();touch.fire=true};$('tFire').ontouchend=$('tFire').ontouchcancel=e=>{e.preventDefault();touch.fire=false};$('tBuild').ontouchstart=e=>{e.preventDefault();if(G)build(G.me)};$('tEat').ontouchstart=e=>{e.preventDefault();if(G)eat(G.me)};$('tShield').ontouchstart=e=>{e.preventDefault();if(G)drink(G.me)};$('tJump').ontouchstart=e=>{e.preventDefault();if(G&&G.me.vehicle)vehFire(G.me.vehicle,G.me);else touch.jump=true};$('tRide').ontouchstart=e=>{e.preventDefault();if(G)toggleVehicle(G.me)};$('tDrop').ontouchstart=e=>{e.preventDefault();if(G)dropGun(G.me)};$('tAim').ontouchstart=e=>{e.preventDefault();touch.aim=!touch.aim;$('tAim').style.borderColor=touch.aim?'#ffd84a':''};
// ---------- loop ----------
function frame(ts){const dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;if(G){update(dt);draw()}else{gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0.62,0.82,0.95,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);ctx.clearRect(0,0,W,H)}requestAnimationFrame(frame)}
function setGfx(level){if(level!=='low'&&level!=='med'&&level!=='high'||level===GFX){paintGfx();return}GFX=level;try{localStorage.setItem('igun_gfx',level)}catch(e){}allocShadow(level==='low'?512:level==='med'?1024:2048);resize();paintGfx()}
function paintGfx(){const b=$('gfxBtn');if(b)b.textContent='GFX '+(GFX==='high'?'HIGH':GFX==='med'?'MEDIUM':'LOW');wireGfx()}
function wireGfx(){const map={gfxLow:'low',gfxMed:'med',gfxHigh:'high'};for(const id in map){const b=$(id);if(!b)continue;b.style.borderColor=GFX===map[id]?'#ffd84a':'';b.onclick=()=>setGfx(map[id])}}
$('gfxBtn').onclick=()=>setGfx(GFX==='low'?'med':GFX==='med'?'high':'low');
setTimeout(()=>{try{const sides=GFX==='low'?28:48;for(const [c,s] of [[1.15,1],[1.1,-1],[1.05,-1],[0.28,1],[0.28,-1]]){const wk=Math.min(1,Math.max(0,(c-0.32)/0.75));const key=c.toFixed(2)+'|'+s+'|'+sides+'|'+wk.toFixed(2);if(!HANDMESH[key])HANDMESH[key]=buildAnatHand(c,s,sides,wk)}}catch(e){}},50);
titleScreen();requestAnimationFrame(frame);
</script>
