function beep(f,d,type,v){try{const ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),gn=ac.createGain();o.type=type||'square';o.frequency.value=f;gn.gain.value=v||0.05;gn.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

  if(best&&gun){const def=WEAPONS[gun.k];const want=def.range*0.55;const dx=best.x-t.x,dy=best.y-t.y;const d=Math.hypot(dx,dy)||1;

function buildMini(g){const c=document.createElement('canvas');c.width=c.height=mini.width;const x=c.getContext('2d');const S=c.width,img=x.createImageData(S,S),d=img.data;
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){const wx=(i+0.5)/S*WORLD,wz=(j+0.5)/S*WORLD;const h=terrainH(wx,wz);let r,gg,b;if(h<-2){const k=clamp(-h/60,0,1);r=30-k*12;gg=112-k*40;b=140-k*34}else if(h<10){r=222;gg=204;b=146}else{const k=clamp(h/240,0,1);r=70+k*95;gg=150-k*25;b=60+k*25;const sl=terrainH(wx+40,wz)-h;const sd=clamp(1-sl*0.012,0.72,1.22);r*=sd;gg*=sd;b*=sd}const o=(j*S+i)*4;d[o]=r;d[o+1]=gg;d[o+2]=b;d[o+3]=255}
  x.putImageData(img,0,0);const k=S/WORLD;x.fillStyle='#8d8d8d';for(const T of g.towns){x.beginPath();x.arc(T.x*k,T.y*k,T.r*0.6*k,0,TAU);x.fill()}x.strokeStyle='#b07a3a';x.lineWidth=2;for(const B of g.bridges){x.beginPath();x.moveTo(B.p0[0]*k,B.p0[1]*k);x.lineTo(B.p1[0]*k,B.p1[1]*k);x.stroke()}
  x.fillStyle='#e8dcc8';for(const h of g.houses)x.fillRect(h.x*k-1,h.y*k-1,2,2);return c}
function drawMini(){const m=mctx,S=mini.width,k=S/WORLD;m.clearRect(0,0,S,S);m.drawImage(G.miniImg,0,0);
  const T=G.tide;m.fillStyle='rgba(20,24,50,.5)';m.beginPath();m.rect(0,0,S,S);m.arc(T.cx*k,T.cy*k,T.r*k,0,TAU,true);m.fill();m.strokeStyle='#8cf';m.lineWidth=1.5;m.beginPath();m.arc(T.cx*k,T.cy*k,T.r*k,0,TAU);m.stroke();
  if(T.tr<T.r-1){m.strokeStyle='#fff';m.setLineDash([3,3]);m.beginPath();m.arc(T.tx*k,T.ty*k,T.tr*k,0,TAU);m.stroke();m.setLineDash([])}
  for(const c of G.chests)if(!c.open){m.fillStyle='#ffd84a';m.fillRect(c.x*k-0.5,c.y*k-0.5,1.5,1.5)}
  const me=G.me;const f=G.focus||me;m.save();m.translate(f.x*k,f.y*k);m.rotate(me.alive?G.cam.yaw:f.aim);m.fillStyle=me.alive?'#fff':'#f66';m.beginPath();m.moveTo(5,0);m.lineTo(-3,3);m.lineTo(-3,-3);m.fill();m.restore()}
function hud(){const me=G.me;$('nAlive').textContent=G.alive;$('kills').textContent=me.kills+' knocked';
  $('hpB').style.width=me.hp+'%';$('hpT').textContent=Math.ceil(me.hp);$('shB').style.width=me.shield+'%';$('shT').textContent=Math.ceil(me.shield);
  $('mats').textContent='🪵 '+me.wood+' · 🪨 '+me.stone+' · 🩹 '+me.lettuce+' (F) · 🧪 '+me.potions+' (G)';
  const T=G.tide;$('tideT').textContent=T.wait>0?'STORM IN '+Math.ceil(T.wait)+'s':T.shrink>0?'STORM CLOSING IN':'STORM';$('tideS').textContent=me.inStorm?'YOU ARE IN THE STORM: run to the eye!':T.wait>0?'stay inside the eye':'';$('tideS').style.color=me.inStorm?'#f88':'#cde';
  const sl=$('slots');if(sl.children.length!==5){sl.innerHTML='';for(let i=0;i<5;i++){const d=document.createElement('div');d.className='slot';d.onclick=()=>{me.sel=i};sl.appendChild(d)}}
  for(let i=0;i<5;i++){const d=sl.children[i];const w=me.weapons[i];d.className='slot'+(i===me.sel?' on':'')+(w?' '+RAR[w.rar].cls:'');d.innerHTML='<span class="k">'+(i+1)+'</span>'+(w?WEAPONS[w.k].n+'<br>'+RAR[w.rar].n:'empty')}
  $('feed').innerHTML=G.feed.map(f=>'<div style="opacity:'+Math.min(1,f.t)+'">'+f.txt+'</div>').join('')}
// ---------- screens ----------
function titleScreen(){$('box').innerHTML='<h1>IRON GUNS</h1><h2>FIRST-PERSON BATTLE ROYALE</h2><p>24 players drop far apart onto a huge island of hills, forests, lakes, bridges and towns. Loot the houses and glowing chests for pistols, shotguns, rifles, rocket launchers and sniper rifles, chop trees for wood, build walls, patch up with medkits, and keep inside the eye as the storm closes in and the rain hammers down. Last one standing wins.</p>'+
  '<p><b>WASD</b> move · <b>Shift</b> sprint · <b>Mouse</b> looks around (click the game to lock the mouse) · <b>Click</b> shoot, or chop trees and rocks with empty hands · <b>Q</b> or right click: build a wall (10 wood) · <b>F</b> medkit · <b>G</b> shield potion · <b>1-5</b> or wheel: weapons<br>On touch: left side moves, drag the right side to look, FIRE button shoots.</p>'+
  '<p style="color:#9c9">Best finish: '+(save.best?'#'+save.best:'none yet')+' · Wins: '+save.wins+' · Games: '+save.games+'</p><button class="btn" id="play">DROP IN</button>';$('msg').style.display='flex';$('play').onclick=start}
function endScreen(won){const me=G.me;save.games++;if(won){save.wins++;save.best=1}else if(!save.best||me.place<save.best)save.best=me.place;persist();
  $('box').innerHTML=(won?'<h1>VICTORY</h1><h2>LAST ONE STANDING</h2>':'<h1>#'+me.place+' OF '+N_PLAYERS+'</h1><h2>KNOCKED OUT</h2>')+'<p>You knocked '+me.kills+' player'+(me.kills===1?'':'s')+'.'+(won?' The island is yours.':' Grab a gun faster next time, and watch the storm.')+'</p><button class="btn" id="again">PLAY AGAIN</button> <button class="btn" id="menu">TITLE</button>';
  $('msg').style.display='flex';$('again').onclick=start;$('menu').onclick=titleScreen}
function start(){G=newGame();$('msg').style.display='none';beep(520,0.1,'triangle');hud()}
// ---------- input ----------
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=true;if(!G||G.phase!=='play'||G.over)return;const me=G.me;
  if(e.code==='KeyQ')build(me);if(e.code==='KeyF')eat(me);if(e.code==='KeyG')drink(me);if(/^Digit[1-5]$/.test(e.code))me.sel=+e.code[5]-1;if(e.code==='Space'){e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.code]=false});
function pointerLocked(){return document.pointerLockElement===cv}
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(pointerLocked()&&G){G.cam.yaw+=(e.movementX||0)*0.0028;G.cam.pitch=clamp(G.cam.pitch-(e.movementY||0)*0.0022,-1.2,1.0)}});
cv.addEventListener('mousedown',e=>{if(e.button===0){mouse.down=true;if(G&&!pointerLocked()&&cv.requestPointerLock){try{cv.requestPointerLock()}catch(x){}}}if(e.button===2&&G&&G.me)build(G.me)});addEventListener('mouseup',()=>mouse.down=false);cv.addEventListener('contextmenu',e=>e.preventDefault());
ov.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{if(!G)return;const me=G.me;me.sel=(me.sel+(e.deltaY>0?1:4))%5});
// touch: left half joystick, right half aim + fire
const touch={move:null,look:false,fire:false,ids:{}};
cv.addEventListener('touchstart',e=>{$('touch').style.display='block';for(const t of e.changedTouches){if(t.clientX<W/2)touch.ids[t.identifier]={kind:'move',x0:t.clientX,y0:t.clientY};else{touch.ids[t.identifier]={kind:'look',lx:t.clientX};touch.look=true}}e.preventDefault()},{passive:false});
cv.addEventListener('touchmove',e=>{for(const t of e.changedTouches){const s=touch.ids[t.identifier];if(!s)continue;if(s.kind==='move'){const dx=t.clientX-s.x0,dy=t.clientY-s.y0;const l=Math.hypot(dx,dy);touch.move={x:dx/Math.max(40,l),y:dy/Math.max(40,l)}}else if(G){G.cam.yaw+=(t.clientX-s.lx)*0.008;G.cam.pitch=clamp(G.cam.pitch-(t.clientY-(s.ly===undefined?t.clientY:s.ly))*0.006,-1.2,1.0);s.lx=t.clientX;s.ly=t.clientY}}e.preventDefault()},{passive:false});
const tEnd=e=>{for(const t of e.changedTouches){const s=touch.ids[t.identifier];if(!s)continue;if(s.kind==='move')touch.move=null;else touch.look=false;delete touch.ids[t.identifier]}};
cv.addEventListener('touchend',tEnd);cv.addEventListener('touchcancel',tEnd);
$('tFire').ontouchstart=e=>{e.preventDefault();touch.fire=true};$('tFire').ontouchend=$('tFire').ontouchcancel=e=>{e.preventDefault();touch.fire=false};$('tBuild').ontouchstart=e=>{e.preventDefault();if(G)build(G.me)};$('tEat').ontouchstart=e=>{e.preventDefault();if(G)eat(G.me)};$('tShield').ontouchstart=e=>{e.preventDefault();if(G)drink(G.me)};
// ---------- loop ----------
function frame(ts){const dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;if(G){update(dt);draw()}else{gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0.62,0.82,0.95,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);ctx.clearRect(0,0,W,H)}requestAnimationFrame(frame)}
titleScreen();requestAnimationFrame(frame);
</script>
</body>
