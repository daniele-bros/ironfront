<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');const mini=$('mini'),mctx=mini.getContext('2d');
const PI=Math.PI,TAU=PI*2,rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
const WORLD=2600,ISLAND=1180,N_PLAYERS=24;
const WEAPONS={
  pistol:{n:'Water Pistol',dmg:9,rate:0.3,spd:560,spread:0.05,range:540,pellets:1,size:4,col:'#5cf',sfx:[900,0.05]},
  blaster:{n:'Bubble Blaster',dmg:7,rate:0.95,spd:430,spread:0.2,range:300,pellets:5,size:5,col:'#9ef',sfx:[300,0.1]},
  pea:{n:'Pea Rifle',dmg:16,rate:0.45,spd:640,spread:0.03,range:760,pellets:1,size:4,col:'#8f4',sfx:[700,0.06]},
  cannon:{n:'Shell Cannon',dmg:40,rate:1.3,spd:380,spread:0.02,range:650,pellets:1,size:9,col:'#fa6',splash:70,sfx:[160,0.18]},
  snorkel:{n:'Sniper Snorkel',dmg:60,rate:1.8,spd:980,spread:0,range:1300,pellets:1,size:4,col:'#fd4',sfx:[1200,0.12]}};
const RAR=[{n:'Common',m:1,c:'#cfd',cls:'c1'},{n:'Rare',m:1.15,c:'#6cf',cls:'c2'},{n:'Epic',m:1.32,c:'#c8f',cls:'c3'},{n:'Legendary',m:1.5,c:'#fc5',cls:'c4'}];
const NAMES=['Sheldon','Crush','Squirt','Franklin','Koopa','Tortuga','Donatello','Leo','Raph','Mikey','Shelly','Speedy','Myrtle','Verne','Tuck','Bowser Jr','Snappy','Pebble','Moss','Bubbles','Flash','Tilly','Gamera'];
const COLORS=['#3a9d4a','#5bb35e','#2e8b57','#6b8e23','#8fbc5a','#49a078','#7cb342','#3d7a3d','#a2c75a','#2f9e8f'];
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
// ---------- state ----------
let G=null,keys={},mouse={x:0,y:0,down:false},last=0,save={best:0,wins:0,games:0};
try{save=Object.assign(save,JSON.parse(localStorage.getItem('igun_save')||'{}'))}catch(e){}
function persist(){try{localStorage.setItem('igun_save',JSON.stringify(save))}catch(e){}}
function newGame(){
  const g={t:0,phase:'ready',ready:3,turtles:[],shots:[],items:[],trees:[],rocks:[],bushes:[],walls:[],chests:[],parts:[],feed:[],
    tide:{cx:WORLD/2,cy:WORLD/2,r:ISLAND+200,tx:WORLD/2,ty:WORLD/2,tr:ISLAND+200,wait:30,shrink:0,stage:0,dps:1.5},alive:N_PLAYERS,placed:0,kills:0,over:false,cam:{x:WORLD/2,y:WORLD/2},shake:0};
  const inLand=(x,y,m)=>Math.hypot(x-WORLD/2,y-WORLD/2)<ISLAND-(m||0);
  const spot=(m)=>{for(let i=0;i<50;i++){const a=rnd(0,TAU),r=Math.sqrt(Math.random())*(ISLAND-m);const x=WORLD/2+Math.cos(a)*r,y=WORLD/2+Math.sin(a)*r;if(g.trees.every(t=>Math.hypot(t.x-x,t.y-y)>50)&&g.rocks.every(t=>Math.hypot(t.x-x,t.y-y)>50))return [x,y]}return [WORLD/2,WORLD/2]};
  for(let i=0;i<150;i++){const [x,y]=spot(60);g.trees.push({x,y,r:rnd(16,26),hp:3})}
  for(let i=0;i<55;i++){const [x,y]=spot(60);g.rocks.push({x,y,r:rnd(14,22),hp:4})}
  for(let i=0;i<70;i++){const [x,y]=spot(40);g.bushes.push({x,y,r:rnd(22,30)})}
  // little shell huts: four wall segments with a gap
  for(let i=0;i<14;i++){const [x,y]=spot(120);const s=70;const segs=[[x,y-s,0],[x,y+s,0],[x-s,y,PI/2]];for(const [wx,wy,a] of segs)g.walls.push({x:wx,y:wy,a,hp:220,stone:true,len:2*s});g.chests.push({x,y,open:false})}
  for(let i=0;i<48;i++){const [x,y]=spot(60);g.chests.push({x,y,open:false})}
  for(let i=0;i<60;i++){const [x,y]=spot(40);g.items.push(makeItem(x,y,Math.random()<0.5?'weapon':pick(['lettuce','shield','wood','stone'])))}
  const names=NAMES.slice().sort(()=>Math.random()-0.5);
  const spawnAt=i=>{const ring=i<9?0.42:0.8;const n=i<9?9:N_PLAYERS-9;const k=i<9?i:i-9;const a=k/n*TAU+(ring>0.5?0.15:0)+rnd(-0.08,0.08);let x=WORLD/2+Math.cos(a)*ISLAND*ring,y=WORLD/2+Math.sin(a)*ISLAND*ring;for(let tries=0;tries<30&&solidAtSetup(x,y);tries++){x+=rnd(-40,40);y+=rnd(-40,40)}return [x,y]};
  const solidAtSetup=(x,y)=>g.trees.some(t=>Math.hypot(t.x-x,t.y-y)<t.r+24)||g.rocks.some(t=>Math.hypot(t.x-x,t.y-y)<t.r+24)||g.walls.some(w=>Math.hypot(w.x-x,w.y-y)<80);
  for(let i=0;i<N_PLAYERS;i++){const [x,y]=spawnAt(i);const t={id:i,x,y,r:17,hp:100,shield:0,wood:i?40:0,stone:0,lettuce:0,potions:0,weapons:[null,null,null,null,null],sel:0,aim:rnd(0,TAU),cd:0,bot:i>0,name:i?names[i-1]:'You',col:i?pick(COLORS):'#ffd84a',alive:true,kills:0,vx:0,vy:0,hurtT:0,hidden:false,ai:{wander:rnd(0,TAU),wt:0,target:null,buildCd:0,seeT:0},walk:0,inWater:false};
    g.turtles.push(t)}
  g.me=g.turtles[0];g.cam.x=g.me.x;g.cam.y=g.me.y;return g}
function makeItem(x,y,kind,extra){const it={x,y,kind,t:0};if(kind==='weapon'){const r=Math.random();it.rar=r<0.55?0:r<0.82?1:r<0.95?2:3;it.w=extra||pick(Object.keys(WEAPONS))}if(kind==='wood'||kind==='stone')it.n=30;return it}
// ---------- helpers ----------
function beep(f,d,type,v){try{const ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),gn=ac.createGain();o.type=type||'square';o.frequency.value=f;gn.gain.value=v||0.05;gn.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function feed(txt){G.feed.unshift({txt,t:6});if(G.feed.length>5)G.feed.length=5}
function banner(txt){const b=$('banner');b.textContent=txt;b.style.opacity=1;clearTimeout(banner.to);banner.to=setTimeout(()=>b.style.opacity=0,1800)}
function wallRect(w){const hl=(w.len||80)/2,ht=7;return w.a===0?{x0:w.x-hl,y0:w.y-ht,x1:w.x+hl,y1:w.y+ht}:{x0:w.x-ht,y0:w.y-hl,x1:w.x+ht,y1:w.y+hl}}
function hitWall(x,y,r){for(const w of G.walls){const R=wallRect(w);const cx=clamp(x,R.x0,R.x1),cy=clamp(y,R.y0,R.y1);if((x-cx)**2+(y-cy)**2<r*r)return w}return null}
function solidAt(x,y,r,self){for(const t of G.trees)if(Math.hypot(t.x-x,t.y-y)<t.r+r)return true;for(const t of G.rocks)if(Math.hypot(t.x-x,t.y-y)<t.r+r)return true;if(hitWall(x,y,r))return true;return false}
function moveTurtle(t,dx,dy){if(!dx&&!dy)return;const nx=t.x+dx,ny=t.y+dy;if(!solidAt(nx,t.y,t.r))t.x=clamp(nx,20,WORLD-20);if(!solidAt(t.x,ny,t.r))t.y=clamp(ny,20,WORLD-20)}
function inBush(t){return G.bushes.some(b=>Math.hypot(b.x-t.x,b.y-t.y)<b.r)}
function losClear(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y);const n=Math.ceil(d/12);for(let i=1;i<n;i++){const x=a.x+(b.x-a.x)*i/n,y=a.y+(b.y-a.y)*i/n;if(hitWall(x,y,2))return false;for(const tr of G.trees)if(Math.hypot(tr.x-x,tr.y-y)<tr.r-2)return false}return true}
function giveWeapon(t,it){const i=t.weapons.findIndex(w=>!w);const w={k:it.w,rar:it.rar};if(i>=0){t.weapons[i]=w;if(!t.bot&&!t.weapons[t.sel])t.sel=i;return true}
  // replace a worse copy of the same gun, or the selected slot if it is lower rarity
  const same=t.weapons.findIndex(x=>x.k===it.w&&x.rar<it.rar);if(same>=0){G.items.push(makeItem(t.x,t.y,'weapon',t.weapons[same].k));G.items[G.items.length-1].rar=t.weapons[same].rar;t.weapons[same]=w;return true}
  if(t.bot&&it.rar>t.weapons[t.sel].rar){t.weapons[t.sel]=w;return true}return false}
function pickup(t,it){if(it.kind==='weapon')return giveWeapon(t,it);if(it.kind==='lettuce'){if(t.lettuce>=6)return false;t.lettuce++;return true}if(it.kind==='shield'){if(t.potions>=4)return false;t.potions++;return true}
  if(it.kind==='wood'){t.wood=Math.min(500,t.wood+it.n);return true}if(it.kind==='stone'){t.stone=Math.min(500,t.stone+it.n);return true}return false}
function openChest(c){c.open=true;beep(600,0.15,'triangle');const n=ri(2,3);for(let i=0;i<n;i++){const a=rnd(0,TAU);const kind=i===0?'weapon':pick(['weapon','lettuce','shield','wood','stone','lettuce']);const it=makeItem(c.x+Math.cos(a)*26,c.y+Math.sin(a)*26,kind);if(kind==='weapon'&&Math.random()<0.4)it.rar=Math.min(3,it.rar+1);G.items.push(it)}}
function eat(t){if(t.lettuce<=0||t.hp>=100)return false;t.lettuce--;t.hp=Math.min(100,t.hp+35);if(!t.bot)beep(500,0.2,'sine');return true}
function drink(t){if(t.potions<=0||t.shield>=100)return false;t.potions--;t.shield=Math.min(100,t.shield+50);if(!t.bot)beep(800,0.2,'sine');return true}
function build(t){const stone=t.wood<10&&t.stone>=10;if(t.wood<10&&!stone)return false;const d=46;const ax=Math.cos(t.aim),ay=Math.sin(t.aim);const x=Math.round((t.x+ax*d)/20)*20,y=Math.round((t.y+ay*d)/20)*20;const a=Math.abs(ax)>Math.abs(ay)?PI/2:0;
  if(G.walls.some(w=>Math.hypot(w.x-x,w.y-y)<30))return false;for(const o of G.turtles){if(!o.alive)continue;const R=wallRect({x,y,a,len:80});const cx=clamp(o.x,R.x0,R.x1),cy=clamp(o.y,R.y0,R.y1);if((o.x-cx)**2+(o.y-cy)**2<(o.r+2)**2)return false}
  G.walls.push({x,y,a,hp:stone?220:120,stone,len:80});if(stone)t.stone-=10;else t.wood-=10;if(!t.bot)beep(240,0.08,'square');return true}
function damage(t,amt,by){if(!t.alive)return;let a=amt;if(t.shield>0){const s=Math.min(t.shield,a);t.shield-=s;a-=s}t.hp-=a;t.hurtT=0.25;if(t===G.me){G.shake=Math.min(8,G.shake+amt*0.15);beep(200,0.08,'sawtooth',0.04)}
  if(t.hp<=0){t.alive=false;t.hp=0;G.alive--;G.placed++;const place=N_PLAYERS-G.placed+1;t.place=place;if(by&&by!==t){by.kills++;if(by===G.me)beep(1000,0.2,'triangle',0.06)}
    feed((by&&by!==t?by.name+' knocked ':'The tide got ')+t.name);for(let i=0;i<12;i++)G.parts.push({x:t.x,y:t.y,vx:rnd(-120,120),vy:rnd(-120,120),t:rnd(0.4,0.9),c:t.col});
    // drop the loot
    for(const w of t.weapons)if(w){const it=makeItem(t.x+rnd(-20,20),t.y+rnd(-20,20),'weapon',w.k);it.rar=w.rar;G.items.push(it)}
    if(t.lettuce)for(let i=0;i<t.lettuce;i++)G.items.push(makeItem(t.x+rnd(-20,20),t.y+rnd(-20,20),'lettuce'));if(t.potions)for(let i=0;i<t.potions;i++)G.items.push(makeItem(t.x+rnd(-20,20),t.y+rnd(-20,20),'shield'));
    if(t.wood>=30){const it=makeItem(t.x+rnd(-20,20),t.y+rnd(-20,20),'wood');it.n=Math.min(150,t.wood);G.items.push(it)}
    if(t===G.me){G.over=true;setTimeout(()=>endScreen(false),1200)}else if(G.alive===1&&G.me.alive){G.over=true;setTimeout(()=>endScreen(true),1000)}}}
function fire(t){const w=t.weapons[t.sel];if(!w||t.cd>0)return;const def=WEAPONS[w.k];t.cd=def.rate;const m=RAR[w.rar].m;
  for(let i=0;i<def.pellets;i++){const a=t.aim+rnd(-def.spread,def.spread);G.shots.push({x:t.x+Math.cos(t.aim)*22,y:t.y+Math.sin(t.aim)*22,vx:Math.cos(a)*def.spd,vy:Math.sin(a)*def.spd,dmg:def.dmg*m,by:t,life:def.range/def.spd,size:def.size,col:def.col,splash:def.splash||0})}
  const d=Math.hypot(t.x-G.me.x,t.y-G.me.y);if(d<700)beep(def.sfx[0],def.sfx[1],'square',0.03*(1-d/800))}

function botThink(t,dt){const ai=t.ai;const T=G.tide;ai.wt-=dt;ai.buildCd-=dt;
  // what can I see
  let best=null,bd=1e9;const vis=inBush(t)?500:430;for(const o of G.turtles){if(o===t||!o.alive)continue;const d=Math.hypot(o.x-t.x,o.y-t.y);const seeR=inBush(o)?150:vis;if(d<seeR&&d<bd&&losClear(t,o)){bd=d;best=o}}

  const outSoon=Math.hypot(t.x-T.cx,t.y-T.cy)>(T.shrink>0?T.tr-80:T.r-120);

  const me=g.me;

  const T=G.tide;$('tideT').textContent=T.wait>0?'TIDE IN '+Math.ceil(T.wait)+'s':T.shrink>0?'TIDE COMING IN':'TIDE';$('tideS').textContent=me.inTide?'YOU ARE OUTSIDE: swim to the ring!':T.wait>0?'stay inside the blue ring':'';$('tideS').style.color=me.inTide?'#f88':'#cde';
  const sl=$('slots');if(sl.children.length!==5){sl.innerHTML='';for(let i=0;i<5;i++){const d=document.createElement('div');d.className='slot';d.onclick=()=>{me.sel=i};sl.appendChild(d)}}
  for(let i=0;i<5;i++){const d=sl.children[i];const w=me.weapons[i];d.className='slot'+(i===me.sel?' on':'')+(w?' '+RAR[w.rar].cls:'');d.innerHTML='<span class="k">'+(i+1)+'</span>'+(w?WEAPONS[w.k].n+'<br>'+RAR[w.rar].n:'empty')}
  $('feed').innerHTML=G.feed.map(f=>'<div style="opacity:'+Math.min(1,f.t)+'">'+f.txt+'</div>').join('')}
// ---------- screens ----------
function titleScreen(){$('box').innerHTML='<h1>IRON GUNS</h1><h2>TURTLE BATTLE ROYALE</h2><p>24 turtles land on Shell Island. Grab water pistols, bubble blasters, shell cannons and sniper snorkels from the glowing chests, chop trees for wood, build shell walls, and stay inside the blue ring as the tide comes in. Last turtle standing wins.</p>'+
  '<p><b>WASD</b> move · <b>Mouse</b> aim · <b>Click</b> shoot (or chop trees and rocks with empty hands) · <b>Q</b> build a wall (10 wood) · <b>F</b> eat lettuce · <b>G</b> drink shield · <b>1-5</b> weapons<br>On touch: left side moves, right side aims and fires.</p>'+
  '<p style="color:#9c9">Best finish: '+(save.best?'#'+save.best:'none yet')+' · Wins: '+save.wins+' · Games: '+save.games+'</p><button class="btn" id="play">DROP IN</button>';$('msg').style.display='flex';$('play').onclick=start}
function endScreen(won){const me=G.me;save.games++;if(won){save.wins++;save.best=1}else if(!save.best||me.place<save.best)save.best=me.place;persist();
  $('box').innerHTML=(won?'<h1>TURTLE VICTORY</h1><h2>LAST TURTLE STANDING</h2>':'<h1>#'+me.place+' OF '+N_PLAYERS+'</h1><h2>KNOCKED OUT</h2>')+'<p>You knocked '+me.kills+' turtle'+(me.kills===1?'':'s')+'.'+(won?' The island is yours.':' Grab a gun faster next time, and watch the ring.')+'</p><button class="btn" id="again">PLAY AGAIN</button> <button class="btn" id="menu">TITLE</button>';
  $('msg').style.display='flex';$('again').onclick=start;$('menu').onclick=titleScreen}
function start(){G=newGame();$('msg').style.display='none';beep(520,0.1,'triangle');hud()}
// ---------- input ----------
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=true;if(!G||G.phase!=='play'||G.over)return;const me=G.me;
  if(e.code==='KeyQ')build(me);if(e.code==='KeyF')eat(me);if(e.code==='KeyG')drink(me);if(/^Digit[1-5]$/.test(e.code))me.sel=+e.code[5]-1;if(e.code==='Space'){e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.code]=false});
cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});cv.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true;if(e.button===2&&G&&G.me)build(G.me)});addEventListener('mouseup',()=>mouse.down=false);cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{if(!G)return;const me=G.me;me.sel=(me.sel+(e.deltaY>0?1:4))%5});
// touch: left half joystick, right half aim + fire
const touch={move:null,aim:null,fire:false,ids:{}};
cv.addEventListener('touchstart',e=>{$('touch').style.display='block';for(const t of e.changedTouches){if(t.clientX<W/2)touch.ids[t.identifier]={kind:'move',x0:t.clientX,y0:t.clientY};else{touch.ids[t.identifier]={kind:'aim',x0:t.clientX,y0:t.clientY};touch.fire=true;touch.aim=null}}e.preventDefault()},{passive:false});
cv.addEventListener('touchmove',e=>{for(const t of e.changedTouches){const s=touch.ids[t.identifier];if(!s)continue;const dx=t.clientX-s.x0,dy=t.clientY-s.y0;if(s.kind==='move'){const l=Math.hypot(dx,dy);touch.move={x:dx/Math.max(40,l),y:dy/Math.max(40,l)}}else if(Math.hypot(dx,dy)>12)touch.aim=Math.atan2(dy,dx)}e.preventDefault()},{passive:false});
const tEnd=e=>{for(const t of e.changedTouches){const s=touch.ids[t.identifier];if(!s)continue;if(s.kind==='move')touch.move=null;else{touch.fire=false}delete touch.ids[t.identifier]}};
cv.addEventListener('touchend',tEnd);cv.addEventListener('touchcancel',tEnd);
$('tBuild').ontouchstart=e=>{e.preventDefault();if(G)build(G.me)};$('tEat').ontouchstart=e=>{e.preventDefault();if(G)eat(G.me)};$('tShield').ontouchstart=e=>{e.preventDefault();if(G)drink(G.me)};
// ---------- loop ----------
function frame(ts){const dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;if(G){update(dt);draw()}else{ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#0a2a3a';ctx.fillRect(0,0,W,H)}requestAnimationFrame(frame)}
titleScreen();requestAnimationFrame(frame);
</script>
</body>
</html>
