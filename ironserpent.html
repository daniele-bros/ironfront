<style>
:root{--gold:#e8c84a;--cream:#ddd5b0;--dim:#6f8a60;--border:#2a4a2a;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#06100a;}
body{font-family:'Share Tech Mono','Courier New',monospace;color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.back{position:absolute;top:10px;left:10px;z-index:30;background:rgba(6,16,10,.85);color:var(--dim);font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:3px;padding:7px 12px;border:1px solid var(--border);text-decoration:none;border-radius:2px;}

<body>
<a class="back" href="/" title="Back to Iron Games">◀ IRON GAMES</a>
<div id="hud"><span>SCORE <b id="hScore">0</b></span><span>LENGTH <b id="hLen">3</b></span><span>SPEED <b id="hSpd">1</b></span><span>BEST <b id="hBest">0</b></span></div>
<canvas id="c" width="600" height="600"></canvas>
<div id="msg"><div id="box"></div></div>
<div id="pad"><div style="left:51px;top:0" data-d="0,-1">▲</div><div style="left:0;top:51px" data-d="-1,0">◀</div><div style="left:102px;top:51px" data-d="1,0">▶</div><div style="left:51px;top:102px" data-d="0,1">▼</div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);const cv=$('c'),ctx=cv.getContext('2d');const N=24;let cell=25;
function resize(){const s=Math.min(innerWidth-24,innerHeight-90,640);cell=Math.max(8,Math.floor(s/N));cv.width=cv.height=cell*N;cv.style.width=cv.style.height=cv.width+'px'}addEventListener('resize',resize);resize();
let G=null,wrapMode=localStorage.getItem('is_wrap')==='1',paused=false;const best=()=>parseInt(localStorage.getItem('is_best')||'0');
function newGame(){return {snake:[[12,12],[11,12],[10,12]],dir:[1,0],nextDir:[1,0],queue:[],food:null,gold:null,goldT:0,shroom:null,shroomT:0,walls:[],score:0,speed:1,stepT:0,over:false,grow:0,flash:0,eatAnim:0,nextWallAt:60}}
function free(x,y){if(G.snake.some(s=>s[0]===x&&s[1]===y))return false;if(G.walls.some(w=>w[0]===x&&w[1]===y))return false;if(G.food&&G.food[0]===x&&G.food[1]===y)return false;if(G.gold&&G.gold[0]===x&&G.gold[1]===y)return false;if(G.shroom&&G.shroom[0]===x&&G.shroom[1]===y)return false;return true}
function spot(){for(let i=0;i<500;i++){const x=Math.floor(Math.random()*N),y=Math.floor(Math.random()*N);if(free(x,y))return [x,y]}return null}
function placeFood(){G.food=spot()}
function addWall(){const h=G.snake[0];const len=2+Math.floor(Math.random()*4);const vert=Math.random()<0.5;for(let t=0;t<40;t++){const x=Math.floor(Math.random()*N),y=Math.floor(Math.random()*N);const cells=[];let ok=true;for(let i=0;i<len;i++){const cx=vert?x:x+i,cy=vert?y+i:y;if(cx>=N||cy>=N||!free(cx,cy)||Math.abs(cx-h[0])+Math.abs(cy-h[1])<6){ok=false;break}cells.push([cx,cy])}if(ok){G.walls.push(...cells);return}}}
function stepTime(){return Math.max(0.055,0.16-(G.speed-1)*0.011)}
function step(){const g=G;if(g.queue.length)g.dir=g.queue.shift();const h=g.snake[0];let nx=h[0]+g.dir[0],ny=h[1]+g.dir[1];
  if(nx<0||ny<0||nx>=N||ny>=N){if(wrapMode){nx=(nx+N)%N;ny=(ny+N)%N}else{die();return}}
  if(g.snake.some((s,i)=>i<g.snake.length-(g.grow>0?0:1)&&s[0]===nx&&s[1]===ny)){die();return}
  if(g.walls.some(w=>w[0]===nx&&w[1]===ny)){die();return}
  g.snake.unshift([nx,ny]);
  if(g.food&&g.food[0]===nx&&g.food[1]===ny){g.score+=10;g.grow+=1;g.eatAnim=1;beep(600,0.06);placeFood();if(g.score%50===0)g.speed++;if(g.score>=g.nextWallAt){g.nextWallAt+=60;addWall();beep(200,0.15,'sawtooth')}if(!g.gold&&Math.random()<0.18){g.gold=spot();g.goldT=7}if(!g.shroom&&g.score>=80&&Math.random()<0.15){g.shroom=spot();g.shroomT=10}}
  else if(g.gold&&g.gold[0]===nx&&g.gold[1]===ny){g.score+=50;g.grow+=2;g.flash=0.4;g.gold=null;beep(900,0.12,'triangle');beep(1200,0.2,'triangle')}
  else if(g.shroom&&g.shroom[0]===nx&&g.shroom[1]===ny){g.shroom=null;const cut=Math.min(g.snake.length-3,4);if(cut>0)g.snake.splice(g.snake.length-cut,cut);g.score=Math.max(0,g.score-20);g.flash=-0.4;beep(150,0.3,'sawtooth')}
  if(g.grow>0)g.grow--;else g.snake.pop();
  $('hScore').textContent=g.score;$('hLen').textContent=g.snake.length;$('hSpd').textContent=g.speed}
function die(){G.over=true;boom();const b=best();if(G.score>b)localStorage.setItem('is_best',String(G.score));$('hBest').textContent=Math.max(b,G.score);$('box').style.display='block';$('box').innerHTML='<h1 style="font-size:30px">THE SERPENT FALLS</h1><p>Score <b style="color:#e8c84a">'+G.score+'</b> · length '+G.snake.length+' · speed '+G.speed+(G.score>b?' · <b style="color:#8ff0a0">new best!</b>':'')+'</p><div class="btn" id="again">PLAY AGAIN</div><div class="btn" id="menu">MENU</div>';$('again').onclick=startGame;$('menu').onclick=titleScreen}
function update(dt){const g=G;if(g.over||paused)return;g.stepT+=dt;if(g.flash>0)g.flash=Math.max(0,g.flash-dt);if(g.flash<0)g.flash=Math.min(0,g.flash+dt);g.eatAnim=Math.max(0,g.eatAnim-dt*4);if(g.gold){g.goldT-=dt;if(g.goldT<=0)g.gold=null}if(g.shroom){g.shroomT-=dt;if(g.shroomT<=0)g.shroom=null}
  while(g.stepT>=stepTime()&&!g.over){g.stepT-=stepTime();step()}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){const c=cell;ctx.fillStyle='#0b1a10';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#0e2214';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if((x+y)%2===0)ctx.fillRect(x*c,y*c,c,c);
  if(!G)return;const g=G;
  if(g.flash){ctx.fillStyle=g.flash>0?'rgba(232,200,74,'+g.flash*0.5+')':'rgba(180,40,120,'+(-g.flash)*0.5+')';ctx.fillRect(0,0,cv.width,cv.height)}
  for(const w of g.walls){ctx.fillStyle='#6a6e72';ctx.fillRect(w[0]*c,w[1]*c,c,c);ctx.fillStyle='#8a8e92';ctx.fillRect(w[0]*c+2,w[1]*c+2,c-4,c/2-2);ctx.fillStyle='#3a3e42';for(const [dx,dy] of [[3,3],[c-5,3],[3,c-5],[c-5,c-5]])ctx.fillRect(w[0]*c+dx,w[1]*c+dy,2,2)}
  if(g.food){const [x,y]=g.food;ctx.fillStyle='#e04040';rr(x*c+3,y*c+4,c-6,c-6,4);ctx.fill();ctx.fillStyle='#5a3a1a';ctx.fillRect(x*c+c/2-1,y*c+1,2,5);ctx.fillStyle='#6fc060';ctx.fillRect(x*c+c/2,y*c+2,5,3)}
  if(g.gold){const [x,y]=g.gold;const p=0.5+0.5*Math.sin(performance.now()/120);ctx.fillStyle='#e8c84a';rr(x*c+3,y*c+4,c-6,c-6,4);ctx.fill();ctx.fillStyle='rgba(255,255,255,'+(0.3+p*0.5)+')';ctx.fillRect(x*c+6,y*c+7,4,4);ctx.fillStyle='#5a3a1a';ctx.fillRect(x*c+c/2-1,y*c+1,2,5)}
  if(g.shroom){const [x,y]=g.shroom;ctx.fillStyle='#a040c0';rr(x*c+2,y*c+3,c-4,c/2,5);ctx.fill();ctx.fillStyle='#e8dcc0';ctx.fillRect(x*c+c/2-3,y*c+c/2,6,c/2-3);ctx.fillStyle='#f0e0ff';ctx.fillRect(x*c+5,y*c+6,3,3);ctx.fillRect(x*c+c-9,y*c+7,3,3)}
  for(let i=g.snake.length-1;i>=0;i--){const [x,y]=g.snake[i];const t=i/g.snake.length;const col=i===0?'#9ae07a':'hsl('+(110-t*25)+',55%,'+(40-t*14)+'%)';ctx.fillStyle=col;const inset=i===0?1:2;rr(x*c+inset,y*c+inset,c-inset*2,c-inset*2,i===0?6:4);ctx.fill();
    if(i>0&&i%2===0){ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(x*c+c/2-2,y*c+c/2-2,4,4)}}
  const h=g.snake[0];const d=g.queue.length?g.queue[0]:g.dir;ctx.fillStyle='#101a10';const ex=h[0]*c+c/2+d[0]*c*0.2,ey=h[1]*c+c/2+d[1]*c*0.2;const px=d[1]*c*0.22,py=d[0]*c*0.22;ctx.fillRect(ex+px-2,ey+py-2,4,4);ctx.fillRect(ex-px-2,ey-py-2,4,4);
  if(g.eatAnim>0){ctx.fillStyle='#e04040';ctx.fillRect(h[0]*c+c/2+d[0]*c*0.5-2,h[1]*c+c/2+d[1]*c*0.5-2,4+g.eatAnim*4,2)}}
/* ---- sound ---- */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=0.05;g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function boom(){const a=ac();if(!a)return;const n=a.sampleRate*0.35;const buf=a.createBuffer(1,n,a.sampleRate);const ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const src=a.createBufferSource();src.buffer=buf;const g=a.createGain();g.gain.value=0.12;src.connect(g);g.connect(a.destination);src.start()}
/* ---- screens & input ---- */
function titleScreen(){G=null;$('box').style.display='block';$('box').innerHTML='<h1>IRON SERPENT</h1><p>Eat the red apples to grow. Every 50 points the serpent speeds up and every 60 an iron wall appears. Golden apples are worth 50 but vanish fast. Purple mushrooms shorten you and cost 20 points.</p><p>Arrow keys or WASD · swipe on touch screens · P pauses</p><div class="btn" id="start">PLAY</div><div class="btn '+(wrapMode?'':'off')+'" id="wrap">EDGES: '+(wrapMode?'WRAP AROUND':'SOLID WALLS')+'</div>';$('start').onclick=startGame;$('wrap').onclick=()=>{wrapMode=!wrapMode;localStorage.setItem('is_wrap',wrapMode?'1':'0');titleScreen()};$('hBest').textContent=best()}
function startGame(){ac();G=newGame();placeFood();paused=false;$('box').style.display='none';$('hScore').textContent='0';$('hLen').textContent='3';$('hSpd').textContent='1'}
function turn(dx,dy){if(!G||G.over)return;const last=G.queue.length?G.queue[G.queue.length-1]:G.dir;if((dx===-last[0]&&dy===-last[1])||(dx===last[0]&&dy===last[1]))return;if(G.queue.length<2)G.queue.push([dx,dy])}
addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[e.code];if(m){e.preventDefault();if(!G||G.over)startGame();turn(m[0],m[1])}else if(e.code==='KeyP'&&G&&!G.over){paused=!paused;$('box').style.display=paused?'block':'none';if(paused)$('box').innerHTML='<h1 style="font-size:28px">PAUSED</h1><p>Press P to continue</p>'}else if((e.code==='Space'||e.code==='Enter')&&(!G||G.over))startGame()});
let tx=0,ty=0;addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)<18&&Math.abs(dy)<18)return;if(!G||G.over){if(!e.target.closest('#box'))startGame()}if(Math.abs(dx)>Math.abs(dy))turn(Math.sign(dx),0);else turn(0,Math.sign(dy))},{passive:true});
for(const b of document.querySelectorAll('#pad div')){b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();const [dx,dy]=b.dataset.d.split(',').map(Number);if(!G||G.over)startGame();turn(dx,dy)},{passive:false});b.addEventListener('mousedown',()=>{const [dx,dy]=b.dataset.d.split(',').map(Number);if(!G||G.over)startGame();turn(dx,dy)})}
let last=0;function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000||0);last=now;if(G)update(dt);draw()}
titleScreen();requestAnimationFrame(frame);
</script>
