<style>

<script>
'use strict';
const $=id=>document.getElementById(id);const rnd=(a,b)=>a+Math.random()*(b-a);const ri=(a,b)=>Math.floor(rnd(a,b+1));const pick=a=>a[Math.floor(Math.random()*a.length)];
const PARTS={
  hair:[{n:'Long',t:['party','ball']},{n:'Bob',t:['school','city']},{n:'Ponytail',t:['sport','beach']},{n:'Curls',t:['party','ball']},{n:'Bun',t:['ball','city']},{n:'Braids',t:['beach','school']},{n:'Short',t:['sport','space']},{n:'Pigtails',t:['school','party']}],
  top:[{n:'T-shirt',t:['school','sport','beach']},{n:'Blouse',t:['city','school']},{n:'Hoodie',t:['sport','rain']},{n:'Jumper',t:['winter','school']},{n:'Puffer jacket',t:['winter','rain']},{n:'Crop top',t:['beach','party']},{n:'Jersey',t:['sport']},{n:'Space suit top',t:['space']},{n:'Raincoat',t:['rain']}],
  bottom:[{n:'Jeans',t:['school','city','rain']},{n:'Skirt',t:['school','party','city']},{n:'Shorts',t:['beach','sport']},{n:'Leggings',t:['sport','winter']},{n:'Long skirt',t:['ball','city']},{n:'Joggers',t:['sport']},{n:'Space suit',t:['space']},{n:'Snow pants',t:['winter']}],
  dress:[{n:'No dress',t:[]},{n:'Sundress',t:['beach','party']},{n:'Ball gown',t:['ball']},{n:'Party dress',t:['party']},{n:'Pinafore',t:['school']},{n:'Knit dress',t:['winter','city']}],
  shoes:[{n:'Trainers',t:['sport','school','city']},{n:'Boots',t:['winter','rain','city']},{n:'Sandals',t:['beach']},{n:'Heels',t:['ball','party']},{n:'Wellies',t:['rain']},{n:'Moon boots',t:['space','winter']},{n:'Flats',t:['school','ball']}],
  hat:[{n:'No hat',t:[]},{n:'Sun hat',t:['beach']},{n:'Beanie',t:['winter','rain']},{n:'Cap',t:['sport','school']},{n:'Tiara',t:['ball','party']},{n:'Space helmet',t:['space']},{n:'Umbrella',t:['rain']}],
  extra:[{n:'Nothing',t:[]},{n:'Glasses',t:['school','city']},{n:'Sunglasses',t:['beach','party']},{n:'Necklace',t:['ball','party','city']},{n:'Scarf',t:['winter','rain']},{n:'Backpack',t:['school','sport']},{n:'Handbag',t:['city','party']},{n:'Star badge',t:['space','sport']}]};
const SKINS=['#fbe0cc','#f0c8a8','#d9a57c','#b07c54','#8a5a3a','#5a3a26'];const HAIRC=['#2a1a10','#5a3a1a','#b07040','#e8c070','#f5f0e0','#d04040','#ff8fd0','#8a60d0','#40a0d0','#3a3a5a'];
const PALETTE=['#ff8fd0','#ff5a7a','#ff9a4a','#ffe070','#9ae0b0','#40c080','#60c0ff','#4060e0','#a070e0','#f0f0f0','#2a2a3a','#8a5a3a'];
const THEMES=[{k:'beach',n:'Beach Day',d:'Sun, sand and sea'},{k:'winter',n:'Winter Walk',d:'Snow on the hills'},{k:'ball',n:'Royal Ball',d:'An invitation from the palace'},{k:'school',n:'First Day of School',d:'Smart and comfy'},{k:'party',n:'Birthday Party',d:'Cake, music and dancing'},{k:'sport',n:'Sports Day',d:'Ready to run'},{k:'rain',n:'Rainy Day',d:'Puddles everywhere'},{k:'space',n:'Space Camp',d:'Three, two, one...'},{k:'city',n:'City Weekend',d:'Shops, cafés and a museum'}];
const SCENES={studio:['#ffe6f6','#f2d0ea'],beach:['#9ad8ff','#f4e2b0'],winter:['#dde8f8','#f5f8ff'],ball:['#3a1a5a','#6a2a8a'],school:['#e8f0d0','#c8d8a0'],party:['#ffd6e8','#ffbfd6'],sport:['#c8f0d8','#8ad0a0'],rain:['#8a98b0','#b8c0d0'],space:['#0a0820','#1a1440'],city:['#d8d8e8','#a8a8c0']};
let L=null,coins=0,mode='free',challenge=null,looks=[];
function newLook(){return {skin:2,hairc:1,hair:0,top:0,topc:'#ff8fd0',bottom:0,bottomc:'#4060e0',dress:0,dressc:'#a070e0',shoes:0,shoesc:'#f0f0f0',hat:0,hatc:'#ffe070',extra:0,extrac:'#ff5a7a',scene:'studio'}}
function save(){try{localStorage.setItem('is_style',JSON.stringify({coins,looks,L}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('is_style'));if(s&&s.L){coins=s.coins||0;looks=s.looks||[];return s.L}}catch(e){}return null}
/* ---- controls ---- */
function controls(){const c=$('controls');let h='';const sel=(k,label,colorKey)=>{const list=PARTS[k];h+='<div class="lbl"><span>'+label+'</span>'+(colorKey?'<input type="color" data-c="'+colorKey+'" value="'+L[colorKey]+'">':'')+'</div><div class="row">'+list.map((p,i)=>'<button class="btn'+(L[k]===i?' on':'')+'" data-k="'+k+'" data-i="'+i+'">'+p.n.toUpperCase()+'</button>').join('')+'</div>'};
  h+='<div class="lbl"><span>SKIN</span></div><div class="pal">'+SKINS.map((s,i)=>'<i style="background:'+s+(L.skin===i?';outline:2px solid #ff8fd0':'')+'" data-skin="'+i+'"></i>').join('')+'</div>';
  h+='<div class="lbl"><span>HAIR COLOUR</span></div><div class="pal">'+HAIRC.map((s,i)=>'<i style="background:'+s+(L.hairc===i?';outline:2px solid #ff8fd0':'')+'" data-hairc="'+i+'"></i>').join('')+'</div>';
  sel('hair','HAIRSTYLE');sel('dress','DRESS','dressc');sel('top','TOP','topc');sel('bottom','BOTTOM','bottomc');sel('shoes','SHOES','shoesc');sel('hat','HAT','hatc');sel('extra','ACCESSORY','extrac');
  h+='<div class="lbl"><span>QUICK COLOURS (click a part first)</span></div><div class="pal">'+PALETTE.map(s=>'<i style="background:'+s+'" data-pal="'+s+'"></i>').join('')+'</div>';
  h+='<div class="lbl"><span>BACKDROP</span></div><div class="row">'+Object.keys(SCENES).map(k=>'<button class="btn'+(L.scene===k?' on':'')+'" data-scene="'+k+'">'+k.toUpperCase()+'</button>').join('')+'</div>';
  c.innerHTML=h;
  for(const b of c.querySelectorAll('button[data-k]'))b.onclick=()=>{L[b.dataset.k]=+b.dataset.i;lastPart=b.dataset.k+'c';if(b.dataset.k==='hair')lastPart=null;controls();save()};
  for(const b of c.querySelectorAll('button[data-scene]'))b.onclick=()=>{L.scene=b.dataset.scene;controls();save()};
  for(const i of c.querySelectorAll('i[data-skin]'))i.onclick=()=>{L.skin=+i.dataset.skin;controls();save()};for(const i of c.querySelectorAll('i[data-hairc]'))i.onclick=()=>{L.hairc=+i.dataset.hairc;controls();save()};
  for(const inp of c.querySelectorAll('input[data-c]'))inp.oninput=()=>{L[inp.dataset.c]=inp.value;lastPart=inp.dataset.c;save()};
  for(const i of c.querySelectorAll('i[data-pal]'))i.onclick=()=>{if(lastPart&&L[lastPart]!==undefined){L[lastPart]=i.dataset.pal;controls();save()}}}
let lastPart='topc';
function randomLook(){const l=L;l.skin=ri(0,SKINS.length-1);l.hairc=ri(0,HAIRC.length-1);for(const k of ['hair','top','bottom','dress','shoes','hat','extra'])l[k]=ri(0,PARTS[k].length-1);if(Math.random()<0.6)l.dress=0;for(const k of ['topc','bottomc','dressc','shoesc','hatc','extrac'])l[k]=pick(PALETTE);controls();save()}
/* ---- challenge scoring ---- */
function hexToHsl(h){const n=parseInt(h.slice(1),16);const r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let hh=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);hh*=60}return [hh,s,l]}
function scoreLook(theme){let pts=0;const notes=[];const parts=[['hair','Hair'],['shoes','Shoes'],['hat','Hat'],['extra','Accessory']];if(L.dress>0)parts.push(['dress','Dress']);else parts.push(['top','Top'],['bottom','Bottom']);
  for(const [k,label] of parts){const p=PARTS[k][L[k]];if(p.t.includes(theme)){pts+=2;notes.push(label+' fits')}else if(p.t.length===0){pts+=0}else{pts-=1}}
  // colour harmony across the worn colours
  const cols=(L.dress>0?[L.dressc]:[L.topc,L.bottomc]).concat([L.shoesc]).map(hexToHsl);let harm=0;for(let i=0;i<cols.length;i++)for(let j=i+1;j<cols.length;j++){const d=Math.abs(cols[i][0]-cols[j][0]);const dd=Math.min(d,360-d);if(dd<35||Math.abs(dd-180)<25||cols[i][1]<0.15||cols[j][1]<0.15)harm++}
  if(harm>=2){pts+=2;notes.push('Colours go together')}else if(harm===1){pts+=1;notes.push('Colours nearly match')}
  if(L.scene===theme){pts+=1;notes.push('Matching backdrop')}
  return {pts,notes}}
function startChallenge(){challenge=pick(THEMES);mode='challenge';$('sMode').textContent='Runway: '+challenge.n;renderPanel()}
function judge(){const {pts,notes}=scoreLook(challenge.k);const stars=pts>=12?3:pts>=8?2:pts>=4?1:0;coins+=stars*5;$('sCoins').textContent=coins+' ★';save();
  show('<h3>'+challenge.n.toUpperCase()+'</h3><p>The judges look over your outfit. <b>'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</b> ('+pts+' points)</p><p>'+(notes.length?notes.join(' · '):'Nothing suited the theme.')+'</p><p>'+(stars===3?'A showstopper! The crowd loves it.':stars===2?'Lovely. One more matching piece would make it perfect.':stars===1?'A start. Think about what the theme needs: shoes, hat and layers all count.':'Back to the wardrobe. Pick pieces made for '+challenge.n.toLowerCase()+'.')+'</p><div class="row"><button class="btn on" id="again">NEW THEME</button><button class="btn" id="ok">KEEP STYLING</button></div>');$('again').onclick=()=>{hide();startChallenge()}}
function renderPanel(){const p=$('panel');if(mode==='challenge'){p.innerHTML='<h4>RUNWAY CHALLENGE</h4><p><b>'+challenge.n+'</b> — '+challenge.d+'. Dress for the theme: every piece that suits it scores, colours that go together score, and a matching backdrop adds a bonus. Three stars earns 15 ★.</p><div class="row"><button class="btn on" id="judge">WALK THE RUNWAY</button><button class="btn" id="quit">BACK TO FREE DESIGN</button></div>';$('judge').onclick=judge;$('quit').onclick=()=>{mode='free';challenge=null;$('sMode').textContent='Free design';renderPanel()}}
  else p.innerHTML='<h4>FREE DESIGN</h4><p>Mix and match every piece and colour you like. Click a piece then a quick colour to recolour it, or use the colour pickers. Save your favourite looks, download them as pictures, or try a runway challenge for stars.</p>'}
function looksScreen(){let h='<h3>MY LOOKS</h3>';if(!looks.length)h+='<p>No saved looks yet. Press SAVE LOOK to keep the one you are wearing.</p>';looks.forEach((l,i)=>{h+='<div class="row" style="margin-bottom:6px"><button class="btn" data-w="'+i+'">'+l.name.toUpperCase()+'</button><button class="btn" data-d="'+i+'" style="flex:0 0 70px">DELETE</button></div>'});h+='<button class="btn" id="ok">CLOSE</button>';show(h);for(const b of document.querySelectorAll('button[data-w]'))b.onclick=()=>{L=Object.assign(newLook(),looks[+b.dataset.w].look);controls();hide();save()};for(const b of document.querySelectorAll('button[data-d]'))b.onclick=()=>{looks.splice(+b.dataset.d,1);save();looksScreen()}}
function saveLook(){const name=prompt('Name this look:','Look '+(looks.length+1));if(name===null)return;looks.push({name:(name||'Look').slice(0,20),look:JSON.parse(JSON.stringify(L))});save();show('<h3>SAVED</h3><p>'+(name||'Look')+' is in My Looks.</p><button class="btn" id="ok">OK</button>')}
function download(){const a=document.createElement('a');a.download='iron-style-look.png';a.href=cv.toDataURL('image/png');a.click()}
function show(html){return new Promise(res=>{$('overlay').innerHTML='<div class="modal">'+html+'</div>';$('overlay').classList.add('on');const b=$('ok');if(b)b.onclick=()=>{hide();res()}})}
function hide(){$('overlay').classList.remove('on');$('overlay').innerHTML=''}
/* ---- drawing ---- */
const cv=$('c'),ctx=cv.getContext('2d');let W=800,H=450;
function resize(){const r=cv.getBoundingClientRect();W=Math.max(300,Math.floor(r.width));H=Math.max(200,Math.floor(r.height));cv.width=W;cv.height=H}addEventListener('resize',resize);resize();
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.min(255,Math.round(((n>>16)&255)*f)),g=Math.min(255,Math.round(((n>>8)&255)*f)),b=Math.min(255,Math.round((n&255)*f));return 'rgb('+r+','+g+','+b+')'}
function draw(){const t=performance.now()/1000;const sc=SCENES[L?L.scene:'studio'];const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,sc[0]);g.addColorStop(1,sc[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!L)return;const s=L.scene;
  if(s==='beach'){ctx.fillStyle='#4aa8e0';ctx.fillRect(0,H*0.55,W,H*0.15);ctx.fillStyle='#f4e2b0';ctx.fillRect(0,H*0.7,W,H);ctx.fillStyle='#ffe070';ctx.beginPath();ctx.arc(W*0.8,H*0.18,40,0,7);ctx.fill()}
  else if(s==='winter'){ctx.fillStyle='#fff';ctx.fillRect(0,H*0.7,W,H);ctx.fillStyle='rgba(255,255,255,0.9)';for(let i=0;i<60;i++)ctx.fillRect((i*73)%W,(i*41+t*30)%H,3,3);ctx.fillStyle='#3a6a3a';for(const x of [W*0.1,W*0.85]){ctx.beginPath();ctx.moveTo(x-40,H*0.7);ctx.lineTo(x,H*0.3);ctx.lineTo(x+40,H*0.7);ctx.fill()}}
  else if(s==='ball'){ctx.fillStyle='#8a2a6a';ctx.fillRect(0,H*0.7,W,H);ctx.fillStyle='#ffd27a';for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(W*0.15+i*W*0.12,H*0.12,10+Math.sin(t*2+i)*2,0,7);ctx.fill()}ctx.strokeStyle='#ffd27a';ctx.lineWidth=2;ctx.strokeRect(W*0.08,H*0.25,W*0.2,H*0.4);ctx.strokeRect(W*0.72,H*0.25,W*0.2,H*0.4)}
  else if(s==='school'){ctx.fillStyle='#c8a070';ctx.fillRect(0,H*0.7,W,H);ctx.fillStyle='#2a5a3a';ctx.fillRect(W*0.1,H*0.15,W*0.3,H*0.3);ctx.fillStyle='#fff';ctx.font='bold 20px Oswald, sans-serif';ctx.fillText('A B C',W*0.14,H*0.3)}
  else if(s==='party'){ctx.fillStyle='#ffe0f0';ctx.fillRect(0,H*0.7,W,H);for(let i=0;i<8;i++){ctx.fillStyle=['#ff5a7a','#60c0ff','#ffe070','#9ae0b0'][i%4];ctx.beginPath();ctx.ellipse(W*0.1+i*W*0.11,H*0.15+Math.sin(t+i)*10,16,20,0,0,7);ctx.fill()}}
  else if(s==='sport'){ctx.fillStyle='#d04030';ctx.fillRect(0,H*0.7,W,H);ctx.fillStyle='#fff';for(let i=0;i<5;i++)ctx.fillRect(0,H*0.72+i*22,W,2)}

  else{const dn=PARTS.dress[l.dress].n,dc=l.dressc;ctx.fillStyle=dc;if(dn==='Ball gown'){ctx.beginPath();ctx.moveTo(-30,-215);ctx.lineTo(30,-215);ctx.lineTo(34,-130);ctx.lineTo(110,-4);ctx.lineTo(-110,-4);ctx.lineTo(-34,-130);ctx.fill();ctx.fillStyle=shade(dc,1.25);for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-80+i*40,-4);ctx.lineTo(-60+i*40,-60);ctx.lineTo(-40+i*40,-4);ctx.fill()}}

    else if(dn==='Pinafore'){ctx.fillStyle='#fff';ctx.fillRect(-30,-215,60,100);ctx.fillStyle=dc;ctx.fillRect(-26,-200,52,85);ctx.fillRect(-20,-215,8,30);ctx.fillRect(12,-215,8,30);ctx.beginPath();ctx.moveTo(-26,-120);ctx.lineTo(26,-120);ctx.lineTo(44,-60);ctx.lineTo(-44,-60);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-52,-210,22,40);ctx.fillRect(30,-210,22,40)}
