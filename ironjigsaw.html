const SCENES={meadow:'Sunset Meadow',sea:'Seaside',night:'Night Sky',village:'Snowy Village',jungle:'Jungle Falls',city:'City Lights'};const SIZES=[3,4,5,6];

function paintScene(k,c){const x=c.getContext('2d');const w=c.width,h=c.height;const g=x.createLinearGradient(0,0,0,h);
  if(k==='meadow'){g.addColorStop(0,'#ff9a60');g.addColorStop(0.5,'#ffd27a');g.addColorStop(1,'#80c060');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#ffe9a0';x.beginPath();x.arc(w*0.7,h*0.42,h*0.14,0,7);x.fill();x.fillStyle='#5a9a40';x.beginPath();x.moveTo(0,h*0.6);for(let i=0;i<=10;i++)x.lineTo(i*w/10,h*0.6-Math.sin(i*1.3)*h*0.08);x.lineTo(w,h);x.lineTo(0,h);x.fill();for(let i=0;i<40;i++){x.fillStyle=['#ff6a9a','#ffe070','#fff','#a070e0'][i%4];x.beginPath();x.arc((i*97)%w,h*0.7+(i*53)%(h*0.28),5,0,7);x.fill()}x.fillStyle='#2a4a2a';for(const tx of [w*0.15,w*0.85]){x.fillRect(tx-6,h*0.45,12,h*0.2);x.beginPath();x.arc(tx,h*0.42,h*0.12,0,7);x.fill()}}
  else if(k==='sea'){g.addColorStop(0,'#7fc4ff');g.addColorStop(0.5,'#d8f0ff');g.addColorStop(1,'#4aa8e0');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#2a88c8';x.fillRect(0,h*0.55,w,h*0.25);x.fillStyle='rgba(255,255,255,0.6)';for(let i=0;i<12;i++)x.fillRect((i*83)%w,h*0.58+(i*31)%(h*0.2),30,3);x.fillStyle='#f4e2b0';x.fillRect(0,h*0.8,w,h);x.fillStyle='#ff5050';x.beginPath();x.arc(w*0.3,h*0.9,h*0.06,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(w*0.72,h*0.62);x.lineTo(w*0.72,h*0.4);x.lineTo(w*0.82,h*0.6);x.fill();x.fillStyle='#8a5a3a';x.fillRect(w*0.66,h*0.62,w*0.2,h*0.05);x.fillStyle='#ffe070';x.beginPath();x.arc(w*0.15,h*0.18,h*0.1,0,7);x.fill()}
  else if(k==='night'){g.addColorStop(0,'#0a0a30');g.addColorStop(1,'#2a1a5a');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#fff';for(let i=0;i<120;i++)x.fillRect((i*197)%w,(i*131)%(h*0.7),i%7?2:3,i%7?2:3);x.fillStyle='#ffe9a0';x.beginPath();x.arc(w*0.75,h*0.25,h*0.12,0,7);x.fill();x.fillStyle='#2a1a5a';x.beginPath();x.arc(w*0.79,h*0.22,h*0.1,0,7);x.fill();x.fillStyle='#101030';x.beginPath();x.moveTo(0,h);x.lineTo(0,h*0.75);x.lineTo(w*0.2,h*0.55);x.lineTo(w*0.4,h*0.7);x.lineTo(w*0.6,h*0.5);x.lineTo(w*0.8,h*0.68);x.lineTo(w,h*0.6);x.lineTo(w,h);x.fill();x.fillStyle='#ffd27a';x.fillRect(w*0.48,h*0.78,w*0.06,h*0.08);x.fillRect(w*0.5,h*0.86,w*0.02,h*0.04)}
  else if(k==='village'){g.addColorStop(0,'#c8d8f0');g.addColorStop(1,'#f0f4ff');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#fff';x.fillRect(0,h*0.65,w,h);for(let i=0;i<3;i++){const hx=w*0.15+i*w*0.3;x.fillStyle=['#c06040','#6080c0','#d0a060'][i];x.fillRect(hx-w*0.09,h*0.45,w*0.18,h*0.25);x.fillStyle='#8a3a2a';x.beginPath();x.moveTo(hx-w*0.11,h*0.45);x.lineTo(hx,h*0.28);x.lineTo(hx+w*0.11,h*0.45);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(hx-w*0.11,h*0.45);x.lineTo(hx,h*0.3);x.lineTo(hx+w*0.11,h*0.45);x.lineTo(hx+w*0.08,h*0.46);x.lineTo(hx,h*0.34);x.lineTo(hx-w*0.08,h*0.46);x.fill();x.fillStyle='#ffe9a0';x.fillRect(hx-w*0.03,h*0.52,w*0.06,h*0.07)}x.fillStyle='rgba(255,255,255,0.9)';for(let i=0;i<60;i++)x.fillRect((i*73)%w,(i*41)%h,3,3);x.fillStyle='#2a5a3a';x.beginPath();x.moveTo(w*0.9,h*0.65);x.lineTo(w*0.95,h*0.35);x.lineTo(w,h*0.65);x.fill()}
  else if(k==='jungle'){g.addColorStop(0,'#2a6a3a');g.addColorStop(1,'#0a3a2a');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#60c0ff';x.fillRect(w*0.42,0,w*0.16,h*0.7);x.fillStyle='#8fe0ff';x.fillRect(w*0.46,0,w*0.04,h*0.7);x.fillStyle='#4aa8e0';x.beginPath();x.ellipse(w*0.5,h*0.82,w*0.3,h*0.14,0,0,7);x.fill();x.fillStyle='#3a9a40';for(let i=0;i<14;i++){const lx=(i*61)%w,ly=(i*47)%(h*0.6);x.beginPath();x.ellipse(lx,ly,w*0.06,h*0.04,i,0,7);x.fill()}x.fillStyle='#ff6a9a';for(let i=0;i<6;i++){x.beginPath();x.arc((i*131+40)%w,h*0.3+(i*71)%(h*0.3),7,0,7);x.fill()}x.fillStyle='#ffd040';x.beginPath();x.arc(w*0.2,h*0.5,10,0,7);x.fill();x.fillStyle='#e04040';x.beginPath();x.arc(w*0.22,h*0.52,7,0,7);x.fill()}
  else{g.addColorStop(0,'#1a1040');g.addColorStop(1,'#4a2a6a');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<9;i++){const bh=h*(0.3+((i*37)%40)/100);x.fillStyle='#2a2040';x.fillRect(i*w/9,h*0.85-bh,w/9-8,bh);x.fillStyle='#ffe9a0';for(let k=0;k<Math.floor(bh/18);k++)for(let j=0;j<3;j++)if((i+k+j)%3)x.fillRect(i*w/9+6+j*(w/9-20)/3,h*0.85-bh+8+k*18,8,10)}x.fillStyle='#101020';x.fillRect(0,h*0.85,w,h);x.fillStyle='#ffd27a';for(let i=0;i<8;i++){x.beginPath();x.arc(w*0.1+i*w*0.11,h*0.88,4,0,7);x.fill()}x.fillStyle='#ff8fd0';x.beginPath();x.arc(w*0.8,h*0.15,h*0.08,0,7);x.fill()}}
const cv=$('c'),ctx=cv.getContext('2d');let W=800,H=450;
function resize(){const r=cv.getBoundingClientRect();W=Math.max(300,Math.floor(r.width));H=Math.max(200,Math.floor(r.height));cv.width=W;cv.height=H;if(P)layout()}addEventListener('resize',resize);resize();
function layout(){P.bw=Math.min(W*0.62,H*0.82);P.bh=P.bw*0.7;P.bx=W*0.04;P.by=(H-P.bh)/2;P.pw=P.bw/N;P.ph=P.bh/N;img=document.createElement('canvas');img.width=Math.round(P.bw);img.height=Math.round(P.bh);paintScene(scene,img);for(const pc of P.pieces)if(!pc.placed&&pc.x===undefined){pc.x=rnd(P.bx+P.bw+20,W-P.pw-10);pc.y=rnd(10,H-P.ph-10)}}
function newPuzzle(){P={pieces:[]};for(let r=0;r<N;r++)for(let c=0;c<N;c++)P.pieces.push({r,c,placed:false});layout();for(const pc of P.pieces){pc.x=rnd(P.bx+P.bw+20,Math.max(P.bx+P.bw+30,W-P.pw-10));pc.y=rnd(10,Math.max(20,H-P.ph-10))}done=false;start=performance.now();peek=0;refresh();beep(500,0.08)}
function refresh(){$('sScene').textContent=SCENES[scene]+' · '+(N*N)+' pieces';$('sPlaced').textContent=(P?P.pieces.filter(p=>p.placed).length:0)+' / '+(N*N);$('scenes').innerHTML=Object.keys(SCENES).map(k=>'<button class="btn'+(scene===k?' on':'')+'" data-s="'+k+'">'+SCENES[k].toUpperCase()+'</button>').join('');for(const b of $('scenes').children)b.onclick=()=>{scene=b.dataset.s;newPuzzle()};$('sizes').innerHTML=SIZES.map(n=>'<button class="btn'+(N===n?' on':'')+'" data-n="'+n+'">'+(n*n)+'</button>').join('');for(const b of $('sizes').children)b.onclick=()=>{N=+b.dataset.n;newPuzzle()};
  const key=scene+N;$('panel').innerHTML='<h4>HOW TO PLAY</h4><p>Drag the loose pieces on the right onto the board on the left. A piece snaps in when it is close to its own spot. Hold PEEK to see the finished picture for a moment.</p><p>Best time for this puzzle: <b>'+(best[key]?fmt(best[key]):'none yet')+'</b></p>'}
function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function draw(){ctx.fillStyle='#3a2a26';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<W;i+=24)ctx.fillRect(i,0,12,H);if(!P)return;
  ctx.fillStyle='#1e1412';ctx.fillRect(P.bx-4,P.by-4,P.bw+8,P.bh+8);ctx.fillStyle='#2e2420';ctx.fillRect(P.bx,P.by,P.bw,P.bh);ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(P.bx+i*P.pw,P.by);ctx.lineTo(P.bx+i*P.pw,P.by+P.bh);ctx.stroke();ctx.beginPath();ctx.moveTo(P.bx,P.by+i*P.ph);ctx.lineTo(P.bx+P.bw,P.by+i*P.ph);ctx.stroke()}
  if(peek>0){ctx.globalAlpha=0.45;ctx.drawImage(img,P.bx,P.by);ctx.globalAlpha=1}
  const order=P.pieces.filter(p=>p.placed).concat(P.pieces.filter(p=>!p.placed&&p!==(drag&&drag.p)));if(drag)order.push(drag.p);
  for(const pc of order){const sx=pc.c*P.pw,sy=pc.r*P.ph;const dx=pc.placed?P.bx+sx:pc.x,dy=pc.placed?P.by+sy:pc.y;if(!pc.placed){ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(dx+4,dy+5,P.pw,P.ph)}ctx.drawImage(img,sx,sy,P.pw,P.ph,dx,dy,P.pw,P.ph);if(!pc.placed){ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.strokeRect(dx+0.5,dy+0.5,P.pw-1,P.ph-1)}}
  if(done){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(P.bx,P.by+P.bh/2-24,P.bw,48);ctx.fillStyle='#ffd27a';ctx.font='bold 22px Oswald, sans-serif';ctx.textAlign='center';ctx.fillText('COMPLETE · '+fmt(doneT),P.bx+P.bw/2,P.by+P.bh/2+8)}
  ctx.fillStyle='rgba(44,30,26,0.55)';ctx.fillRect(0,0,W,26);ctx.fillStyle='#ffd8c0';ctx.font='bold 13px Oswald, sans-serif';ctx.textAlign='left';ctx.fillText(SCENES[scene].toUpperCase()+' · DRAG THE PIECES ONTO THE BOARD',150,17)}
let doneT=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.1,(now-last)/1000||0);last=now;if(peek>0)peek-=dt;if(P&&!done)$('sTime').textContent=fmt((now-start)/1000);draw()}
const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return [(t.clientX-r.left)*W/r.width,(t.clientY-r.top)*H/r.height]};
function down(x,y){if(!P||done)return;ac();for(let i=P.pieces.length-1;i>=0;i--){const pc=P.pieces[i];if(pc.placed)continue;if(x>=pc.x&&x<=pc.x+P.pw&&y>=pc.y&&y<=pc.y+P.ph){drag={p:pc,dx:x-pc.x,dy:y-pc.y};return}}}
function move(x,y){if(!drag)return;drag.p.x=x-drag.dx;drag.p.y=y-drag.dy}
function up(){if(!drag)return;const pc=drag.p;const tx=P.bx+pc.c*P.pw,ty=P.by+pc.r*P.ph;if(Math.abs(pc.x-tx)<P.pw*0.35&&Math.abs(pc.y-ty)<P.ph*0.35){pc.placed=true;beep(700,0.06);if(P.pieces.every(p=>p.placed)){done=true;doneT=(performance.now()-start)/1000;const key=scene+N;if(!best[key]||doneT<best[key]){best[key]=doneT;try{localStorage.setItem('ij_best',JSON.stringify(best))}catch(e){}}beep(900,0.3,'triangle')}}drag=null;refresh()}
cv.addEventListener('mousedown',e=>{const [x,y]=pos(e);down(x,y)});cv.addEventListener('mousemove',e=>{const [x,y]=pos(e);move(x,y)});addEventListener('mouseup',up);
cv.addEventListener('touchstart',e=>{const [x,y]=pos(e);down(x,y);e.preventDefault()},{passive:false});cv.addEventListener('touchmove',e=>{const [x,y]=pos(e);move(x,y);e.preventDefault()},{passive:false});cv.addEventListener('touchend',up);
$('bNew').onclick=newPuzzle;$('bPeek').onmousedown=()=>peek=2;$('bPeek').ontouchstart=e=>{peek=2;e.preventDefault()};
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=0.05;g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
$('overlay').innerHTML='<div class="modal title"><h1>IRON JIGSAW</h1><div class="tag">PIECE BY PIECE</div><p>Six little painted scenes, cut into 9, 16, 25 or 36 pieces. Drag each piece onto the board and it snaps into place when it is close. The clock runs while you work and your best time for every puzzle is kept.</p><button class="btn on" id="go">START</button></div>';$('overlay').classList.add('on');$('go').onclick=()=>{$('overlay').classList.remove('on');newPuzzle()};
