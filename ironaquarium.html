const $=id=>document.getElementById(id);const clamp=(v,a,b)=>v<a?a:v>b?b:v;const rnd=(a,b)=>a+Math.random()*(b-a);const ri=(a,b)=>Math.floor(rnd(a,b+1));const pick=a=>a[Math.floor(Math.random()*a.length)];

function newState(){return {coins:40,fish:[],algae:10,decor:{},t:Date.now()}}

  p.innerHTML='<h4>HOW TO PLAY</h4><p>With FEED selected, tap the water to drop flakes and the fish swim over to eat. Green algae creeps over the glass: pick WIPE and drag across the glass to clean it. Hungry fish in a dirty tank are unhappy and earn nothing; well-fed fish in a clean, decorated tank earn coins every minute. Buy new fish and decorations in the shop. Up to twelve fish fit in the tank.</p>'}
function buy(a){const [t,k]=a.split(':');if(t==='fish'){const f=FISH[k];if(S.coins<f.price||S.fish.length>=12)return;S.coins-=f.price;S.fish.push(newFish(k));log('A '+f.n.toLowerCase()+' joins the tank!','good');beep(800,0.1)}else{const d=DECOR.find(d=>d.k===k);if(S.decor[k]||S.coins<d.price)return;S.coins-=d.price;S.decor[k]=true;log('Added the '+d.n.toLowerCase()+'.','good')}refresh();renderPanel()}
function tap(x,y){if(!S)return;ac();if(tool==='feed'){for(let i=0;i<4;i++)food.push({x:x+rnd(-14,14),y:Math.max(30,y)+rnd(-6,6),vy:rnd(8,16),t:12});beep(600,0.05)}}
function wipeAt(x,y){if(tool!=='wipe'||!S)return;S.algae=clamp(S.algae-1.2,0,100);wipe={x,y,t:0.3}}
function tick(dt){S.algae=clamp(S.algae+dt*0.12,0,100);for(const f of S.fish){f.hunger=clamp(f.hunger-dt*0.25,0,100)}

  if(S.decor.bubbler&&Math.random()<dt*6)bubbles.push({x:W*0.75+rnd(-6,6),y:H-30,r:rnd(2,5),t:3});for(const b of bubbles){b.y-=dt*40;b.t-=dt}bubbles=bubbles.filter(b=>b.t>0&&b.y>20);
  coinT+=dt;if(coinT>=60){coinT=0;const hp=happiness();if(hp>=60){let e=0;for(const f of S.fish)e+=FISH[f.k].earn;S.coins+=e;log('Your happy fish earned '+e+' coins.','good')}else log('The fish are unhappy ('+hp+'%). Feed them and clean the glass.')}

const cv=$('c'),ctx=cv.getContext('2d');let W=800,H=450;

function draw(){const t=performance.now()/1000;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3aa0e0');g.addColorStop(1,'#0e4a7a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.08)';for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(W*0.1+i*W*0.16+Math.sin(t+i)*20,0);ctx.lineTo(W*0.14+i*W*0.16+Math.sin(t+i)*20,0);ctx.lineTo(W*0.3+i*W*0.16,H);ctx.lineTo(W*0.2+i*W*0.16,H);ctx.fill()}

function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.1,(now-last)/1000||0);last=now;if(S){tick(dt);if(Math.floor(now/800)!==Math.floor((now-dt*1000)/800))refresh()}draw()}
let dragging=false;const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return [(t.clientX-r.left)*W/r.width,(t.clientY-r.top)*H/r.height]};
