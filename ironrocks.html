<script>
'use strict';
const $=id=>document.getElementById(id);const cv=$('c'),ctx=cv.getContext('2d');let W=800,H=600;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',resize);resize();
const TAU=Math.PI*2;const rnd=(a,b)=>a+Math.random()*(b-a);
let G=null;const keys={};const touch={};
function newGame(){return {ship:null,rocks:[],shots:[],parts:[],saucers:[],sshots:[],score:0,lives:3,wave:0,respawnT:0,saucerT:20,over:false,started:true,shake:0,hyperCd:0,waveClearT:0,extraAt:10000,up:{rapid:0,spread:0,shield:0,engine:0,heavy:0,hyperfast:0},shieldUp:false,choosing:false}}
function makeShip(){return {x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2,inv:3,thrust:false,fireCd:0,alive:true}}
function makeRock(x,y,size,vx,vy){const n=8+Math.floor(Math.random()*5);const pts=[];for(let i=0;i<n;i++){const ang=i/n*TAU;const r=size*rnd(0.72,1.15);pts.push([Math.cos(ang)*r,Math.sin(ang)*r])}return {x,y,size,vx:vx!==undefined?vx:rnd(-1,1)*60/Math.sqrt(size/20),vy:vy!==undefined?vy:rnd(-1,1)*60/Math.sqrt(size/20),a:rnd(0,TAU),spin:rnd(-1,1),pts,hp:size>=50?2:1}}
function spawnWave(){G.wave++;G.shieldUp=G.up.shield>0;if(G.wave>1&&G.wave%5===0){spawnSaucer('mother');G.saucerT=6}else if(G.wave>1&&G.wave%4===0){for(let i=0;i<3;i++)spawnSaucer('hunter');G.saucerT=4}const n=3+G.wave;for(let i=0;i<n;i++){let x,y;do{x=Math.random()*W;y=Math.random()*H}while(Math.hypot(x-W/2,y-H/2)<220);G.rocks.push(makeRock(x,y,56))}$('hWave').textContent=G.wave}
function burst(x,y,n,col,sp){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rnd(20,sp||140);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rnd(0.3,0.9),col})}}
function wrap(o){if(o.x<-40)o.x+=W+80;if(o.x>W+40)o.x-=W+80;if(o.y<-40)o.y+=H+80;if(o.y>H+40)o.y-=H+80}
function fire(){const s=G.ship;if(!s||!s.alive||s.fireCd>0||G.shots.length>=6+G.up.spread*6+G.up.rapid*2)return;s.fireCd=0.18*Math.pow(0.78,G.up.rapid);const angs=G.up.spread?[-0.18,0,0.18]:[0];for(const da of angs){const a=s.a+da;G.shots.push({x:s.x+Math.cos(a)*16,y:s.y+Math.sin(a)*16,vx:s.vx+Math.cos(a)*480,vy:s.vy+Math.sin(a)*480,t:1.1,dmg:1+G.up.heavy})}beep(900,0.05,'square',0.04)}
function hyper(){const s=G.ship;if(!s||!s.alive||G.hyperCd>0)return;G.hyperCd=G.up.hyperfast?1.2:3;burst(s.x,s.y,20,'#7fd0ff',120);s.x=rnd(40,W-40);s.y=rnd(40,H-40);s.vx=s.vy=0;s.inv=Math.max(s.inv,0.6);if(Math.random()<0.08){killShip();return}burst(s.x,s.y,20,'#7fd0ff',120);beep(300,0.2,'sawtooth',0.05)}
function killShip(){const s=G.ship;if(!s||!s.alive)return;if(G.shieldUp){G.shieldUp=false;s.inv=Math.max(s.inv,1);burst(s.x,s.y,24,'#7fd0ff',160);beep(400,0.2,'triangle',0.06);return}s.alive=false;burst(s.x,s.y,40,'#ffd27a',220);G.shake=0.5;G.lives--;$('hLives').textContent=G.lives;boom(0.5);if(G.lives<=0){G.over=true;endScreen()}else G.respawnT=2.2}
function addScore(n){G.score+=n;$('hScore').textContent=G.score;if(G.score>=G.extraAt){G.extraAt+=10000;G.lives++;$('hLives').textContent=G.lives;beep(1200,0.3,'triangle',0.06)}}
function hitRock(r,idx,byPlayer){r.hp--;if(r.hp>0){burst(r.x,r.y,4,'#9aa3b0',60);return}G.rocks.splice(idx,1);burst(r.x,r.y,r.size>40?16:10,'#9aa3b0',110);boom(r.size>40?0.25:0.15);if(byPlayer)addScore(r.size>=50?20:r.size>=28?50:100);
  if(r.size>=28){const ns=r.size>=50?30:16;for(let k=0;k<2;k++){const a=Math.random()*TAU,sp=rnd(50,110)+(r.size>=50?0:30);G.rocks.push(makeRock(r.x,r.y,ns,r.vx*0.4+Math.cos(a)*sp,r.vy*0.4+Math.sin(a)*sp))}}}
const ALIENS={scout:{n:'Scout',hp:1,r:12,score:150,col:'#9ae0ff'},big:{n:'Saucer',hp:1,r:22,score:200,col:'#7fffb0'},small:{n:'Raider',hp:1,r:14,score:1000,col:'#7fffb0'},hunter:{n:'Hunter',hp:2,r:16,score:500,col:'#ff7fd0'},warship:{n:'Warship',hp:6,r:30,score:1500,col:'#ff9a4a'},mother:{n:'Mothership',hp:24,r:46,score:5000,col:'#ffd27a'}};
function spawnSaucer(kind){const r=Math.random();const w=G.wave;const type=kind||(w<2?(r<0.5?'scout':'big'):w<4?(r<0.3?'scout':r<0.7?'big':'small'):w<6?(r<0.2?'scout':r<0.45?'big':r<0.7?'small':r<0.9?'hunter':'warship'):(r<0.15?'scout':r<0.35?'big':r<0.55?'small':r<0.8?'hunter':'warship'));const d=ALIENS[type];const big=type==='big';const y=rnd(60,H-60);const dir=Math.random()<0.5?1:-1;
  G.saucers.push({type,d,x:dir>0?-30:W+30,y,vx:dir*(big?70:type==='small'?110:type==='scout'?170:type==='warship'?35:type==='mother'?25:0),vy:type==='scout'?rnd(-80,80):0,big,t:0,fireT:rnd(0.8,1.6),turnT:rnd(1,2.5),hp:d.hp,hpMax:d.hp,burst:0,spawnT:4})}
function maxSaucers(){return 1+Math.min(4,Math.ceil(G.wave/2))}
function update(dt){if(G.over||G.choosing)return;const s=G.ship;G.hyperCd=Math.max(0,G.hyperCd-dt);G.shake=Math.max(0,G.shake-dt);
  if(!s.alive){G.respawnT-=dt;if(G.respawnT<=0){const safe=G.rocks.every(r=>Math.hypot(r.x-W/2,r.y-H/2)>120);if(safe){G.ship=makeShip()}}}
  else{const left=keys.ArrowLeft||keys.KeyA||touch.left,right=keys.ArrowRight||keys.KeyD||touch.right,th=keys.ArrowUp||keys.KeyW||touch.thrust;if(left)s.a-=4.2*dt;if(right)s.a+=4.2*dt;s.thrust=!!th;if(th){const acc=300*(1+G.up.engine*0.3);s.vx+=Math.cos(s.a)*acc*dt;s.vy+=Math.sin(s.a)*acc*dt;if(Math.random()<0.6)G.parts.push({x:s.x-Math.cos(s.a)*14,y:s.y-Math.sin(s.a)*14,vx:-Math.cos(s.a)*120+rnd(-30,30),vy:-Math.sin(s.a)*120+rnd(-30,30),t:0.25,col:'#ff9a3a'})}
    const sp=Math.hypot(s.vx,s.vy);if(sp>420){s.vx*=420/sp;s.vy*=420/sp}s.vx*=Math.pow(0.55,dt);s.vy*=Math.pow(0.55,dt);s.x+=s.vx*dt;s.y+=s.vy*dt;wrap(s);s.fireCd-=dt;s.inv=Math.max(0,s.inv-dt);if(keys.Space||touch.fire)fire()}
  for(const r of G.rocks){r.x+=r.vx*dt;r.y+=r.vy*dt;r.a+=r.spin*dt;wrap(r)}
  for(const b of G.shots){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;wrap(b)}G.shots=G.shots.filter(b=>b.t>0);
  for(const b of G.sshots){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;wrap(b)}G.sshots=G.sshots.filter(b=>b.t>0);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}G.parts=G.parts.filter(p=>p.t>0);
  // saucers
  G.saucerT-=dt;if(G.saucerT<=0&&G.saucers.length<maxSaucers()){G.saucerT=rnd(7,13)-Math.min(4,G.wave*0.5);spawnSaucer()}
  for(const u of G.saucers){u.t+=dt;
    if(u.type==='hunter'){ // the hunter dart chases the ship, keeps a little distance and fires aimed bursts
      if(s.alive){const dx=s.x-u.x,dy=s.y-u.y;const d=Math.hypot(dx,dy)||1;const want=d>220?1:d<140?-0.6:0;u.vx+=(dx/d*want*180+Math.cos(u.t*2)*60-u.vx)*dt*1.5;u.vy+=(dy/d*want*180+Math.sin(u.t*2)*60-u.vy)*dt*1.5}
      u.x+=u.vx*dt;u.y+=u.vy*dt;wrap(u)}
    else{u.x+=u.vx*dt;u.y+=u.vy*dt;u.turnT-=dt;if(u.turnT<=0){u.turnT=rnd(1,2.5);u.vy=u.type==='scout'?rnd(-160,160):u.type==='mother'?rnd(-25,25):rnd(-60,60)}if(u.y<30||u.y>H-30)u.vy*=-1;if(u.type==='mother'){if(u.x<60||u.x>W-60)u.vx*=-1;u.spawnT-=dt;if(u.spawnT<=0&&G.saucers.length<7){u.spawnT=4;const sc=ALIENS.scout;G.saucers.push({type:'scout',d:sc,x:u.x,y:u.y,vx:rnd(-170,170),vy:rnd(-120,120),big:false,t:0,fireT:1.5,turnT:1.5,hp:1,hpMax:1,burst:0,spawnT:0})}}}
    u.fireT-=dt;
    if(u.fireT<=0&&s.alive){const aim=Math.atan2(s.y-u.y,s.x-u.x);let a,sp=260;
      if(u.type==='hunter'){u.burst=(u.burst||0)+1;u.fireT=u.burst%3===0?rnd(1.6,2.4):0.16;a=aim+rnd(-0.08,0.08);sp=320}
      else if(u.type==='scout'){u.fireT=rnd(1.6,2.6);a=aim+rnd(-0.6,0.6);sp=220}
      else if(u.type==='warship'){u.fireT=rnd(1.8,2.4);for(const da of [-0.35,0.35])G.sshots.push({x:u.x,y:u.y,vx:Math.cos(aim+da)*240,vy:Math.sin(aim+da)*240,t:1.8});a=aim;sp=240}
      else if(u.type==='mother'){u.fireT=rnd(0.9,1.4);a=aim+rnd(-0.2,0.2);sp=280}
      else if(u.big){u.fireT=rnd(1,1.6);a=aim+rnd(-0.5,0.5)}
      else{u.fireT=rnd(0.6,1);a=aim+rnd(-0.12,0.12)}
      G.sshots.push({x:u.x,y:u.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:1.8});beep(u.type==='hunter'?800:500,0.06,'square',0.03)}}
  G.saucers=G.saucers.filter(u=>u.type==='hunter'||u.type==='mother'||(u.x>-60&&u.x<W+60));
  // collisions: shots vs rocks
  for(let i=G.shots.length-1;i>=0;i--){const b=G.shots[i];let hit=false;for(let j=G.rocks.length-1;j>=0;j--){const r=G.rocks[j];if(Math.hypot(b.x-r.x,b.y-r.y)<r.size*0.95){hitRock(r,j,true);hit=true;break}}
    if(!hit)for(let j=G.saucers.length-1;j>=0;j--){const u=G.saucers[j];if(Math.hypot(b.x-u.x,b.y-u.y)<u.d.r){u.hp-=(b.dmg||1);hit=true;if(u.hp>0){burst(u.x,u.y,6,u.d.col,80);break}G.saucers.splice(j,1);burst(u.x,u.y,u.type==='mother'?80:u.type==='warship'?40:22,u.d.col,u.type==='mother'?260:160);addScore(u.d.score);boom(u.type==='mother'?0.8:0.3);break}}
    if(hit)G.shots.splice(i,1)}
  // saucer shots and rocks vs ship
  if(s.alive&&s.inv<=0){for(const r of G.rocks)if(Math.hypot(s.x-r.x,s.y-r.y)<r.size*0.8+10){killShip();break}
    if(s.alive)for(const b of G.sshots)if(Math.hypot(s.x-b.x,s.y-b.y)<12){killShip();break}
    if(s.alive)for(const u of G.saucers)if(Math.hypot(s.x-u.x,s.y-u.y)<u.d.r+4){killShip();break}}
  // saucer shots vs rocks
  for(let i=G.sshots.length-1;i>=0;i--){const b=G.sshots[i];for(let j=G.rocks.length-1;j>=0;j--){const r=G.rocks[j];if(Math.hypot(b.x-r.x,b.y-r.y)<r.size*0.95){hitRock(r,j,false);G.sshots.splice(i,1);break}}}
  if(G.rocks.length===0&&!G.saucers.some(u=>u.type==='mother')){G.waveClearT+=dt;if(G.waveClearT>2){G.waveClearT=0;offerUpgrades()}}}
function draw(){ctx.fillStyle='#02040a';ctx.fillRect(0,0,W,H);ctx.save();if(G&&G.shake>0)ctx.translate(rnd(-6,6)*G.shake,rnd(-6,6)*G.shake);
  // stars
  ctx.fillStyle='#8893a8';for(let i=0;i<90;i++){const x=(i*197)%W,y=(i*131)%H;ctx.fillRect(x,y,i%7===0?2:1,i%7===0?2:1)}
  if(!G){ctx.restore();return}
  ctx.lineWidth=2;ctx.lineJoin='round';
  for(const r of G.rocks){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.a);ctx.strokeStyle=r.hp>1?'#c9c2b0':'#9aa3b0';ctx.beginPath();r.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.stroke();ctx.restore()}
  for(const u of G.saucers){ctx.save();ctx.translate(u.x,u.y);if(u.hpMax>1){ctx.fillStyle='#300';ctx.fillRect(-u.d.r,-u.d.r-10,u.d.r*2,3);ctx.fillStyle=u.d.col;ctx.fillRect(-u.d.r,-u.d.r-10,u.d.r*2*u.hp/u.hpMax,3)}
    if(u.type==='scout'){ctx.strokeStyle=u.d.col;ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(9,6);ctx.lineTo(0,2);ctx.lineTo(-9,6);ctx.closePath();ctx.stroke();ctx.restore();continue}
    if(u.type==='warship'){ctx.strokeStyle=u.d.col;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(-14,-14);ctx.lineTo(14,-14);ctx.lineTo(34,0);ctx.lineTo(14,14);ctx.lineTo(-14,14);ctx.closePath();ctx.moveTo(-34,0);ctx.lineTo(34,0);ctx.moveTo(-10,-14);ctx.lineTo(-6,-24);ctx.lineTo(6,-24);ctx.lineTo(10,-14);ctx.moveTo(-20,14);ctx.lineTo(-20,22);ctx.moveTo(20,14);ctx.lineTo(20,22);ctx.stroke();ctx.restore();continue}
    if(u.type==='mother'){ctx.strokeStyle=u.d.col;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,46,16,0,0,TAU);ctx.stroke();ctx.beginPath();ctx.ellipse(0,-10,22,12,0,Math.PI,0);ctx.stroke();ctx.lineWidth=2;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.arc(i*12,6,3+(Math.floor(u.t*4+i)%2),0,TAU);ctx.stroke()}ctx.restore();continue}
    if(u.type==='hunter'){ctx.rotate(Math.atan2(u.vy,u.vx));ctx.strokeStyle='#ff7fd0';ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-12,-12);ctx.lineTo(-6,0);ctx.lineTo(-12,12);ctx.closePath();ctx.moveTo(-6,0);ctx.lineTo(6,0);ctx.stroke();ctx.restore();continue}const k=u.big?1:0.65;ctx.strokeStyle='#7fffb0';ctx.beginPath();ctx.moveTo(-24*k,0);ctx.lineTo(-10*k,-8*k);ctx.lineTo(10*k,-8*k);ctx.lineTo(24*k,0);ctx.lineTo(10*k,8*k);ctx.lineTo(-10*k,8*k);ctx.closePath();ctx.moveTo(-24*k,0);ctx.lineTo(24*k,0);ctx.moveTo(-6*k,-8*k);ctx.lineTo(-4*k,-15*k);ctx.lineTo(4*k,-15*k);ctx.lineTo(6*k,-8*k);ctx.stroke();ctx.restore()}
  const s=G.ship;if(s&&s.alive&&(s.inv<=0||Math.floor(s.inv*10)%2===0)){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.strokeStyle='#e8c84a';ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-12,-11);ctx.lineTo(-7,0);ctx.lineTo(-12,11);ctx.closePath();ctx.stroke();if(G.shieldUp){ctx.strokeStyle='rgba(127,208,255,0.7)';ctx.beginPath();ctx.arc(0,0,24,0,TAU);ctx.stroke()}if(s.thrust&&Math.random()<0.8){ctx.strokeStyle='#ff9a3a';ctx.beginPath();ctx.moveTo(-8,-5);ctx.lineTo(-20-Math.random()*8,0);ctx.lineTo(-8,5);ctx.stroke()}ctx.restore()}
  ctx.fillStyle='#fff8d0';for(const b of G.shots)ctx.fillRect(b.x-2,b.y-2,4,4);ctx.fillStyle='#7fffb0';for(const b of G.sshots)ctx.fillRect(b.x-2,b.y-2,4,4);
  for(const p of G.parts){ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillStyle=p.col;ctx.fillRect(p.x-1.5,p.y-1.5,3,3)}ctx.globalAlpha=1;
  // upgrades
  {const names=UPG.filter(u=>u.k!=='life'&&G.up[u.k]).map(u=>u.n+(G.up[u.k]>1?' '+G.up[u.k]:''));if(names.length){ctx.fillStyle='#9fb0d0';ctx.font='11px Share Tech Mono, monospace';ctx.textAlign='right';ctx.fillText(names.join(' · ').toUpperCase(),W-12,H-16)}}
  // lives
  for(let i=0;i<G.lives;i++){ctx.save();ctx.translate(24+i*22,H-24);ctx.rotate(-Math.PI/2);ctx.strokeStyle='#e8c84a';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-7,-6);ctx.lineTo(-4,0);ctx.lineTo(-7,6);ctx.closePath();ctx.stroke();ctx.restore()}
  ctx.restore()}
/* ---- upgrades between waves ---- */
const UPG=[{k:'rapid',n:'Rapid Fire',d:'Shoot faster and hold more shots in the air',max:3},{k:'spread',n:'Spread Shot',d:'Three shots in a fan',max:1},{k:'shield',n:'Deflector Shield',d:'Absorbs one hit every wave',max:1},{k:'engine',n:'Afterburners',d:'Stronger thrust',max:2},{k:'heavy',n:'Heavy Shells',d:'Every shot does double damage: big rocks and warships go down fast',max:1},{k:'hyperfast',n:'Quick Jump',d:'Hyperspace recharges in a second',max:1},{k:'life',n:'Spare Ship',d:'One more life',max:99}];
function offerUpgrades(){const pool=UPG.filter(u=>u.k==='life'||G.up[u.k]<u.max);const picks=[];while(picks.length<3&&pool.length){const i=Math.floor(Math.random()*pool.length);picks.push(pool.splice(i,1)[0])}G.choosing=true;$('box').style.display='block';$('box').innerHTML='<h1 style="font-size:26px">WAVE '+G.wave+' CLEAR</h1><p>Choose an upgrade (press 1, 2 or 3)</p>'+picks.map((u,i)=>'<div class="btn" data-u="'+u.k+'" style="display:block;text-align:left">'+(i+1)+' · '+u.n.toUpperCase()+(u.k!=='life'&&G.up[u.k]?' (LVL '+(G.up[u.k]+1)+')':'')+'<br><span style="font-size:11px;letter-spacing:1px;color:#9fb0d0;font-family:Share Tech Mono,monospace">'+u.d+'</span></div>').join('');G.picks=picks;for(const b of document.querySelectorAll('[data-u]'))b.onclick=()=>takeUpgrade(b.dataset.u)}
function takeUpgrade(k){if(!G||!G.choosing)return;if(k==='life'){G.lives++;$('hLives').textContent=G.lives}else G.up[k]++;G.choosing=false;$('box').style.display='none';beep(1000,0.2,'triangle',0.06);spawnWave()}
/* ---- sound ---- */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=vol||0.05;g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function boom(d){const a=ac();if(!a)return;const n=a.sampleRate*d;const buf=a.createBuffer(1,n,a.sampleRate);const ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const src=a.createBufferSource();src.buffer=buf;const g=a.createGain();g.gain.value=0.12;src.connect(g);g.connect(a.destination);src.start()}
/* ---- screens ---- */
const best=()=>parseInt(localStorage.getItem('ir_best')||'0');
function titleScreen(){G=null;$('box').style.display='block';$('box').innerHTML='<h1>IRON ROCKS</h1><p>Spin, thrust and blast the drifting rocks into dust. Big rocks split into smaller, faster ones. Alien saucers come for you in growing numbers and every one of them shoots at you: big saucers spray, small ones aim, and the pink hunter darts chase you down with three-shot bursts. Scouts are weak and twitchy, warships are armoured and fire in a fan, and every fifth wave a mothership arrives that spawns scouts until you bring it down. Every fourth wave a swarm of hunters comes. Each wave you clear lets you pick an upgrade: rapid fire, spread shot, a deflector shield, afterburners, heavy shells, quick hyperspace or a spare ship. Hyperspace jumps you somewhere random, at your own risk.</p><p>← → or A D turn · ↑ or W thrust · SPACE fire · H hyperspace · P pause<br>On touch screens use the buttons at the bottom.</p><p style="color:#e8c84a">BEST: '+best()+'</p><div class="btn" id="start">PLAY</div>';$('start').onclick=startGame;$('hBest').textContent='BEST '+best()}
function startGame(){ac();G=newGame();G.ship=makeShip();spawnWave();$('hScore').textContent='0';$('hLives').textContent='3';$('box').style.display='none'}
function endScreen(){const b=best();if(G.score>b)localStorage.setItem('ir_best',String(G.score));$('box').style.display='block';$('box').innerHTML='<h1 style="font-size:32px">GAME OVER</h1><p>You reached wave '+G.wave+' with <b style="color:#e8c84a">'+G.score+'</b> points.'+(G.score>b?' A new best!':' Best: '+Math.max(b,G.score))+'</p><div class="btn" id="again">PLAY AGAIN</div><div class="btn" id="menu">MENU</div>';$('again').onclick=startGame;$('menu').onclick=titleScreen;$('hBest').textContent='BEST '+Math.max(b,G.score)}
let paused=false;
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!G){if(e.code==='Enter'||e.code==='Space')startGame();return}if(G.over){if(e.code==='Enter'||e.code==='Space')startGame();return}if(G.choosing){const n=parseInt(e.key);if(n>=1&&n<=3&&G.picks&&G.picks[n-1])takeUpgrade(G.picks[n-1].k);return}if(e.code==='KeyH')hyper();if(e.code==='KeyP'){paused=!paused;$('box').style.display=paused?'block':'none';if(paused)$('box').innerHTML='<h1 style="font-size:28px">PAUSED</h1><p>Press P to continue</p>'}});
addEventListener('keyup',e=>{keys[e.code]=false});
for(const b of document.querySelectorAll('.tb')){const k=b.dataset.k;const on=e=>{e.preventDefault();touch[k]=true;if(k==='hyper'&&G)hyper();if(!G||G.over){if(k==='fire')startGame()}};const off=e=>{e.preventDefault();touch[k]=false};b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off);b.addEventListener('touchcancel',off);b.addEventListener('mousedown',on);b.addEventListener('mouseup',off)}
let last=0;function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000||0);last=now;if(G&&!paused)update(dt);draw()}
titleScreen();requestAnimationFrame(frame);
</script>
