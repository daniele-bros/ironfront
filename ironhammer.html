<script>

const ENEMIES={peasant:{n:'Rebel Peasant',hp:18,atk:4,sp:50,w:16,col:'#8a6a4a',xp:8,coin:3},bandit:{n:'Bandit',hp:30,atk:7,sp:70,w:16,col:'#4a3a3a',xp:14,coin:6},footman:{n:'Footman',hp:55,atk:10,sp:55,w:18,col:'#5a6a7a',xp:22,coin:9},archer:{n:'Archer',hp:28,atk:9,sp:40,w:14,col:'#4a6a3a',xp:20,coin:8,ranged:true},knight:{n:'Black Knight',hp:100,atk:15,sp:45,w:20,col:'#2a2a30',xp:45,coin:20},lord:{n:'Rebel Lord',hp:240,atk:22,sp:40,w:26,col:'#6a1a1a',xp:150,coin:90,boss:true}};
const BATTLES=[
  {n:'Skirmish at the mill',w:[['peasant',5]]},
  {n:'Bandits on the king\'s road',w:[['peasant',3],['bandit',4]]},
  {n:'The bridge at Ashford',w:[['bandit',4],['footman',3],['archer',2]]},
  {n:'Siege of Greywall',w:[['footman',5],['archer',3],['bandit',3]]},
  {n:'The Black Knight\'s company',w:[['footman',4],['archer',3],['knight',2]]},
  {n:'Battle of Redmoor',w:[['footman',6],['archer',4],['knight',3]]},
  {n:'The Rebel Lord\'s stand',w:[['knight',4],['archer',4],['footman',4],['lord',1]]}];
/* ===================== STATE ===================== */
let S=null,mine=null,battle=null,forge=null,scene='mine';const keys={},touch={};
function newState(){return {lvl:1,xp:0,coins:20,ore:{coal:0,iron:0,gold:0,gem:0},ing:{iron:0,steel:0,gold:0},items:[],equip:{weapon:null,shield:null,armor:null},up:{pick:0,lamp:0,bag:0,boots:0},stam:100,won:0,battleIdx:0,hp:100,seed:ri(1,1e9)}}
function save(){try{localStorage.setItem('ih_save',JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('ih_save'));if(s&&s.ore)return Object.assign(newState(),s)}catch(e){}return null}
const stamMax=()=>100+S.up.boots*40;const bagMax=()=>12+S.up.bag*8;const oreCount=()=>S.ore.coal+S.ore.iron+S.ore.gold+S.ore.gem;
const rankOf=st=>RANKS[Math.min(RANKS.length-1,st.lvl<ARMY_LEVEL?st.lvl-1:ARMY_LEVEL+Math.min(5,Math.floor((st.won||0)/2)))];const rank=()=>rankOf(S);
function atk(){const w=S.equip.weapon;return 2+(w?Math.round(w.atk*QUAL[w.q].m):0)+Math.floor(S.lvl/2)}
function def(){let d=0;for(const k of ['shield','armor']){const it=S.equip[k];if(it)d+=Math.round(it.def*QUAL[it.q].m)}return d}
function addXp(n){S.xp+=n;let up=false;while(S.xp>=xpFor(S.lvl)){S.xp-=xpFor(S.lvl);S.lvl++;up=true;log('Level '+S.lvl+': you are now '+rank()+'.','good');if(S.lvl===ARMY_LEVEL)show('<h3>THE KING\'S LEVY</h3><p>A rider in royal colours stops at the forge. Rebels are burning the villages, and the king needs every smith who can swing what he makes. You are called to the army. Use the ARMY tab to march, bring your best sword and armour, and win battles to rise through the ranks.</p><button class="btn" id="ok">FOR THE KING</button>').then(()=>{});}if(up)refresh()}
function log(t,cls){const el=document.createElement('p');if(cls)el.className=cls;el.textContent=t;$('log').appendChild(el);while($('log').children.length>8)$('log').removeChild($('log').firstChild);$('log').scrollTop=$('log').scrollHeight}
function show(html){return new Promise(res=>{$('overlay').innerHTML='<div class="modal">'+html+'</div>';$('overlay').classList.add('on');const b=$('ok');if(b)b.onclick=()=>{hide();res()}})}
function hide(){$('overlay').classList.remove('on');$('overlay').innerHTML=''}
function refresh(){$('sRank').textContent=rank();$('sLvl').textContent='Level '+S.lvl;$('xpBar').style.width=(100*S.xp/xpFor(S.lvl))+'%';$('sCoins').textContent=S.coins;$('sStam').textContent=Math.round(S.stam)+' / '+stamMax();$('stamBar').style.width=(100*S.stam/stamMax())+'%';$('sOre').textContent=S.ore.coal+' · '+S.ore.iron+' · '+S.ore.gold+' · '+S.ore.gem+'  ('+oreCount()+'/'+bagMax()+')';$('sIng').textContent=S.ing.iron+' · '+S.ing.steel+' · '+S.ing.gold;
  const e=['weapon','shield','armor'].map(k=>S.equip[k]?S.equip[k].n:null).filter(Boolean);$('sEquip').textContent=(e.length?e.join(', '):'bare hands')+' · ATK '+atk()+' DEF '+def();
  for(const [id,sc] of [['tMine','mine'],['tForge','forge'],['tArmy','battle']])$(id).classList.toggle('on',scene===sc);$('tArmy').disabled=S.lvl<ARMY_LEVEL;$('tArmy').textContent=S.lvl<ARMY_LEVEL?'ARMY (LVL '+ARMY_LEVEL+')':'ARMY';save()}
/* ===================== MINE ===================== */
const MW=36,MH=140,CELL=28;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genMine(){const r=mulberry(S.seed);const g=new Array(MH);for(let y=0;y<MH;y++){g[y]=new Array(MW);for(let x=0;x<MW;x++){let b;if(y===0)b=0;else if(y<4)b=1;else if(y>=MH-1)b=7;else{const d=y/MH;const q=r();b=q<0.06+d*0.04?3:q<0.09+d*0.12?4:(d>0.3&&q<0.12+d*0.16)?5:(d>0.55&&q<0.13+d*0.17)?6:(d>0.4&&q<0.2+d*0.15)?8:2;if(y<10&&(b===5||b===6))b=4}g[y][x]=b}}
  for(let y=1;y<4;y++)g[y][MW>>1]=0; // shaft
  for(let i=0;i<18;i++){const cx=ri(2,MW-3),cy=ri(12,MH-6),rr=ri(1,3);for(let y=cy-rr;y<=cy+rr;y++)for(let x=cx-rr;x<=cx+rr;x++)if(y>3&&y<MH-1&&(x-cx)**2+(y-cy)**2<=rr*rr)g[y][x]=0} // caves
  return g}
function startMine(){if(!mine)mine={g:genMine(),x:MW>>1,y:0,px:MW>>1,py:0,dig:null,t:0,face:1,hauled:0};scene='mine';refresh();renderPanel()}
function cellOk(x,y){return x>=0&&x<MW&&y>=0&&y<MH}
function mineInput(dt){const m=mine;if(m.dig){m.dig.t-=dt;if(m.dig.t<=0){const {x,y}=m.dig;const b=m.g[y][x];const def=BLOCK[b];if(def.ore){S.ore[def.ore]++;if(def.ore==='gem')log('A gem! Worth a fortune at the forge.','good')}m.g[y][x]=0;m.dig=null;S.stam=Math.max(0,S.stam-def.h*1.2);if(S.stam<=0)haul();refresh()}return}
  if(Math.abs(m.px-m.x)>0.01||Math.abs(m.py-m.y)>0.01){const sp=7*dt;m.px+=clamp(m.x-m.px,-sp,sp);m.py+=clamp(m.y-m.py,-sp,sp);return}
  // gravity
  if(m.y<MH-1&&m.g[m.y+1][m.x]===0&&!(keys.ArrowUp||keys.KeyW||touch.up)){m.y++;return}
  let dx=0,dy=0;if(keys.ArrowLeft||keys.KeyA||touch.left)dx=-1;else if(keys.ArrowRight||keys.KeyD||touch.right)dx=1;else if(keys.ArrowDown||keys.KeyS||touch.down)dy=1;else if(keys.ArrowUp||keys.KeyW||touch.up)dy=-1;
  if(!dx&&!dy)return;if(dx)m.face=dx;const nx=m.x+dx,ny=m.y+dy;if(!cellOk(nx,ny))return;const b=m.g[ny][nx];
  if(b===0){if(dy<0&&m.y===0)return;m.x=nx;m.y=ny;S.stam=Math.max(0,S.stam-0.15);if(S.stam<=0)haul();return}
  const def=BLOCK[b];if(b===7)return;const tier=S.up.pick;if((b===5&&tier<1)||(b===6&&tier<2)||(b===8&&tier<1)){flash('Your pickaxe is too weak for '+def.n+'. Upgrade it at the forge.');return}
  if(def.ore&&oreCount()>=bagMax()){flash('Your ore bag is full. Climb up and go to the forge.');return}
  m.dig={x:nx,y:ny,t:def.h*0.45/(1+tier*0.35),tot:def.h*0.45/(1+tier*0.35)}}
let flashT=0,flashMsg='';function flash(t){if(flashMsg===t&&flashT>0)return;flashMsg=t;flashT=2.5}
function haul(){const m=mine;const lost={};for(const k in S.ore){const l=Math.floor(S.ore[k]/2);S.ore[k]-=l;if(l)lost[k]=l}m.x=MW>>1;m.y=0;m.px=m.x;m.py=0;m.dig=null;S.stam=stamMax()*0.5;log('You collapsed from exhaustion. The other miners hauled you up, but half your ore was lost on the way.','bad');refresh()}
function surfaceReturn(){if(mine.y!==0){flash('Climb back up to the surface first.');return}S.stam=stamMax();log('Rested at the mine head: stamina restored.','good');refresh()}
function drawMine(){const m=mine;const g=m.g;const camX=m.px*CELL-W/2+CELL/2,camY=Math.max(-H*0.35,m.py*CELL-H/2+CELL/2);
  // sky and ground
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5f8fc8');sky.addColorStop(1,'#9fc3e6');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const x0=Math.max(0,Math.floor(camX/CELL)-1),x1=Math.min(MW-1,Math.ceil((camX+W)/CELL)+1),y0=Math.max(0,Math.floor(camY/CELL)-1),y1=Math.min(MH-1,Math.ceil((camY+H)/CELL)+1);
  const lampR=4+S.up.lamp*2.5;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const b=g[y][x];const sx=x*CELL-camX,sy=y*CELL-camY;if(y===0){continue}

/* ===================== PANEL ===================== */
function renderPanel(){const p=$('panel');if(scene==='mine'){p.innerHTML='<h4>THE MINE</h4><p>Walk with the arrow keys or WASD and push into rock to dig it. Coal and iron are near the top; gold, gems and hard rock lie deeper. Every swing costs stamina, and if it runs out the other miners haul you up and half your ore is lost. Climb back through your tunnels to the surface.</p><div class="it"><span>Mine head<small>Rest here to refill stamina (E or ●)</small></span><button id="pRest">REST</button></div><div class="it"><span>Dig a fresh mine<small>Keeps your ore, new tunnels and ore seams</small></span><button id="pNew">NEW SHAFT</button></div>';$('pRest').onclick=surfaceReturn;$('pNew').onclick=()=>{if(mine&&mine.y!==0){flash('Climb back up first.');return}S.seed=ri(1,1e9);mine=null;startMine();log('A new shaft is sunk beside the old one.')}}
  else if(scene==='forge'){let h='<h4>SMELTER</h4>';h+=row('Iron ingot','1 iron ore + 1 coal',S.ore.iron>=1&&S.ore.coal>=1,'SMELT','smelt:iron');h+=row('Steel ingot','2 iron ingots + 2 coal',S.ing.iron>=2&&S.ore.coal>=2,'SMELT','smelt:steel');h+=row('Gold ingot','1 gold ore + 1 coal',S.ore.gold>=1&&S.ore.coal>=1,'SMELT','smelt:gold');
    h+='<h4>ANVIL</h4>';for(const it of ITEMS){const cost=Object.entries(it.cost).map(e=>e[1]+' '+e[0]).join(' + ');h+=row(it.n+(it.atk?' · ATK '+it.atk:' · DEF '+it.def),(S.lvl<it.lvl?'Level '+it.lvl+' · ':'')+cost,canCraft(it)&&!forge.anvil,'FORGE','craft:'+it.k)}
    h+='<h4>ARMOURY</h4>';if(!S.items.length)h+='<p>Nothing forged yet.</p>';S.items.forEach((it,i)=>{const eq=Object.values(S.equip).includes(it);h+='<div class="it"><span>'+it.n+(eq?' ✔':'')+'<small>'+(it.atk?'ATK '+Math.round(it.atk*QUAL[it.q].m):'DEF '+Math.round(it.def*QUAL[it.q].m))+' · sells for '+it.price+'</small></span><span><button data-a="equip:'+i+'" '+(eq?'disabled':'')+'>EQUIP</button> <button data-a="sell:'+i+'">SELL</button></span></div>'});
    h+='<h4>MINING UPGRADES</h4>';for(const u of UPGRADES){const l=S.up[u.k];h+=row(u.n+' '+(l>=u.max?'(max)':'lvl '+l+' → '+(l+1)),l>=u.max?'':u.desc(l)+' · '+u.price(l+1)+' coins',l<u.max&&S.coins>=u.price(l+1),'BUY','up:'+u.k)}
    p.innerHTML=h;for(const b of p.querySelectorAll('button[data-a]'))b.onclick=()=>{const [a,v]=b.dataset.a.split(':');if(a==='smelt')smelt(v);else if(a==='craft')startCraft(ITEMS.find(i=>i.k===v));else if(a==='equip')equip(+v);else if(a==='sell')sell(+v);else if(a==='up')buyUp(v)}}
  else{const b=battle;p.innerHTML='<h4>'+b.name.toUpperCase()+'</h4><p>Battle '+(b.idx+1)+'. Move with ← →, swing with SPACE, block with SHIFT or ↓. Blocking only works facing the enemy, and a shield makes it far better. Allies fight beside you. Rise in rank with every two victories.</p><p>ATK '+atk()+' · DEF '+def()+' · HP '+b.hpMax+'</p><div class="it"><span>Retreat<small>Leave the field now</small></span><button id="pRetreat">RETREAT</button></div>';$('pRetreat').onclick=()=>{if(battle&&!battle.over){battle.over=true;scene='forge';forge={anvil:null};log('You withdrew from '+battle.name+'.');refresh();renderPanel()}}}}
function row(name,sub,ok,label,action){return '<div class="it"><span>'+name+'<small>'+sub+'</small></span><button data-a="'+action+'" '+(ok?'':'disabled')+'>'+label+'</button></div>'}
/* ===================== CANVAS / LOOP ===================== */
const cv=$('c'),ctx=cv.getContext('2d');let W=800,H=450,last=0;
function resize(){const r=cv.getBoundingClientRect();W=Math.max(320,Math.floor(r.width));H=Math.max(200,Math.floor(r.height));cv.width=W;cv.height=H}addEventListener('resize',resize);resize();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000||0);last=now;if(!S)return;flashT=Math.max(0,flashT-dt);for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=500*dt;s.t-=dt}sparks=sparks.filter(s=>s.t>0);
  if(scene==='mine'){mineInput(dt);drawMine()}else if(scene==='forge'){const a=forge.anvil;if(a&&!a.done){a.pos+=a.dir*a.speed*dt;if(a.pos>1){a.pos=1;a.dir=-1}if(a.pos<0){a.pos=0;a.dir=1}a.flash=Math.max(0,a.flash-dt)}drawForge()}else if(scene==='battle'){battleTick(dt);drawBattle()}}
/* ===================== SOUND ===================== */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=0.05;g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
/* ===================== INPUT / START ===================== */
function action(){if(scene==='mine'){if(mine.y===0&&Math.abs(mine.x-(MW>>1))<=2)surfaceReturn()}else if(scene==='forge')hammer()}
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!S)return;if(e.code==='KeyE'&&scene==='mine')action();if(e.code==='Space'&&scene==='forge'&&!e.repeat)hammer();if(e.code==='Digit1')startMine();if(e.code==='Digit2')startForge();if(e.code==='Digit3')startBattle()});
addEventListener('keyup',e=>{keys[e.code]=false});
cv.addEventListener('mousedown',()=>{ac();if(scene==='forge')hammer()});
for(const b of document.querySelectorAll('.tb')){const k=b.dataset.k;const on=e=>{e.preventDefault();ac();touch[k]=true;if(k==='action')action()};const off=e=>{e.preventDefault();touch[k]=false};b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off);b.addEventListener('touchcancel',off);b.addEventListener('mousedown',on);b.addEventListener('mouseup',off)}
$('tMine').onclick=()=>{ac();if(scene==='battle'&&battle&&!battle.over)return;startMine()};$('tForge').onclick=()=>{ac();if(scene==='battle'&&battle&&!battle.over)return;startForge()};$('tArmy').onclick=()=>{ac();if(scene==='battle')return;if(mine&&mine.y!==0){flash('Climb back up to the surface first.');return}startBattle()};
function titleScreen(){const saved=load();$('overlay').innerHTML='<div class="modal title"><h1>IRON HAMMER</h1><div class="tag">MINE · FORGE · FIGHT</div><p>Dig coal and iron from a deep mine, smelt it and hammer it into swords, shields and armour. Every blade you forge makes you a better smith, until the day the king\'s levy rides up to the forge and you march to war with the gear you made yourself.</p>'+(saved?'<button class="btn on" id="cont">CONTINUE — LEVEL '+saved.lvl+' '+rankOf(saved).toUpperCase()+'</button>':'')+'<button class="btn" id="new" style="margin-top:6px">NEW GAME</button><p style="margin-top:10px;font-size:11px;color:#9a8a60">Keys 1, 2, 3 switch between mine, forge and army. On touch screens use the buttons at the bottom.</p></div>';$('overlay').classList.add('on');
  const begin=st=>{S=st;mine=null;hide();startMine();log('Welcome to the mine, apprentice. Dig iron and coal, then take them to the forge.')};if(saved)$('cont').onclick=()=>begin(saved);$('new').onclick=()=>begin(newState())}
titleScreen();requestAnimationFrame(frame);
</script>
</body>
</html>
