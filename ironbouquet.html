<style>
:root{--gold:#e8c84a;--cream:#fff6f8;--dim:#b890a0;--panel:rgba(50,22,36,.94);--border:#8a4a66;--accent:#ff9ac8;}
*{box-sizing:border-box;margin:0;padding:0;}html,body{width:100%;height:100%;overflow:hidden;background:#2e1420;}
body{font-family:'Share Tech Mono','Courier New',monospace;color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:none;}
#wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 310px;}#main{position:relative;overflow:hidden;}canvas#c{width:100%;height:100%;display:block;}

<body>
<a class="back" href="/" title="Back to Iron Games">◀ IRON GAMES</a>
<div id="wrap">
  <div id="main"><canvas id="c"></canvas><div id="overlay"></div></div>
  <div id="side">
    <h2 class="t">IRON BOUQUET</h2>
    <div class="stat"><span id="sDay">Day 1 · order 1 of 6</span><b id="sCoins">0 coins</b></div>
    <div class="lbl">ADD A STEM (UP TO 9)</div>

    <div class="lbl">WRAP</div>

    <div class="lbl">RIBBON</div>

    <div class="row"><button class="btn" id="bUndo">REMOVE LAST</button><button class="btn" id="bClear">START OVER</button><button class="btn on" id="bGive">HAND IT OVER</button></div>
    <div id="panel"></div>
  </div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);const clamp=(v,a,b)=>v<a?a:v>b?b:v;const rnd=(a,b)=>a+Math.random()*(b-a);const ri=(a,b)=>Math.floor(rnd(a,b+1));const pick=a=>a[Math.floor(Math.random()*a.length)];
const FLOWERS={rose:{n:'Rose',col:'#e0304a',hue:'red',mood:['romantic','classic'],price:4,lvl:1},tulip:{n:'Tulip',col:'#ff7ab0',hue:'pink',mood:['spring','cheerful'],price:3,lvl:1},daisy:{n:'Daisy',col:'#ffffff',centre:'#ffd040',hue:'white',mood:['simple','cheerful'],price:2,lvl:1},sunflower:{n:'Sunflower',col:'#ffd040',centre:'#6a3a1a',hue:'yellow',mood:['sunny','cheerful'],price:4,lvl:1},lily:{n:'Lily',col:'#fff0f8',hue:'white',mood:['elegant','classic'],price:5,lvl:2},lavender:{n:'Lavender',col:'#a070e0',hue:'purple',mood:['calm','spring'],price:3,lvl:2},peony:{n:'Peony',col:'#ff9ac8',hue:'pink',mood:['romantic','elegant'],price:6,lvl:3},bluebell:{n:'Bluebell',col:'#6a8af0',hue:'blue',mood:['calm','spring'],price:4,lvl:3}};
const WRAPS=[['kraft','#c8a070'],['pink','#ffb0d0'],['white','#f8f8f8'],['blue','#a0c8ff'],['purple','#c8a0f0']];const RIBBONS=[['red','#e03050'],['gold','#ffd040'],['green','#60c080'],['pink','#ff80b0'],['blue','#60a0ff']];
const MOODS={romantic:'something romantic',cheerful:'something cheerful',classic:'something classic',spring:'a touch of spring',sunny:'something sunny',elegant:'something elegant',simple:'something simple',calm:'something calm'};
let S=null,B=null,order=null;
function newState(){return {coins:20,day:1,n:0,lvl:1,xp:0,served:0,best:0}}
function save(){try{localStorage.setItem('ibq_save',JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('ibq_save'));if(s&&s.coins!==undefined)return s}catch(e){}return null}
const plural=(n,c)=>{n=n.toLowerCase();return c===1?n:n.endsWith('y')?n.slice(0,-1)+'ies':n+'s'};
const avail=()=>Object.keys(FLOWERS).filter(k=>FLOWERS[k].lvl<=S.lvl);
function newOrder(){const fl=avail();const kind=pick(['count','count','hue','mood','count','mood']);const o={name:pick(['Ada','Rosa','Mr Patel','Grandma June','Leo','Mia','The mayor','Captain Ng','Sofia','Omar']),wrap:Math.random()<0.6?pick(WRAPS)[0]:null,ribbon:Math.random()<0.5?pick(RIBBONS)[0]:null,size:ri(3,7)};
  if(kind==='count'){const picks=[];const n=ri(1,2);while(picks.length<n){const k=pick(fl);if(!picks.find(p=>p[0]===k))picks.push([k,ri(2,4)])}o.counts=picks;o.text=picks.map(p=>p[1]+' '+plural(FLOWERS[p[0]].n,p[1])).join(' and ')+(o.size>picks.reduce((a,p)=>a+p[1],0)?', about '+o.size+' stems in all':'')}
  else if(kind==='hue'){const hues=[...new Set(fl.map(k=>FLOWERS[k].hue))];o.hue=pick(hues);o.text='mostly '+o.hue+' flowers, about '+o.size+' stems'}
  else{const moods=[...new Set(fl.flatMap(k=>FLOWERS[k].mood))];o.mood=pick(moods);o.text=MOODS[o.mood]+', about '+o.size+' stems'}
  o.text+=(o.wrap?', in '+o.wrap+' paper':'')+(o.ribbon?' with a '+o.ribbon+' ribbon':'')+'.';return o}
function startOrder(){order=newOrder();B={stems:[],wrap:'kraft',ribbon:'red'};refresh();renderPanel()}
function score(){const st=B.stems;let pts=0,max=0;const notes=[];const cnt={};for(const k of st)cnt[k]=(cnt[k]||0)+1;
  if(order.counts){for(const [k,n] of order.counts){max+=3;const have=cnt[k]||0;if(have>=n){pts+=3;notes.push(n+' '+plural(FLOWERS[k].n,n)+' ✔')}else if(have>0){pts+=1;notes.push('only '+have+' '+plural(FLOWERS[k].n,have))}else notes.push('no '+plural(FLOWERS[k].n,2))}}
  if(order.hue){max+=3;const h=st.filter(k=>FLOWERS[k].hue===order.hue).length;if(h>=st.length*0.6&&st.length){pts+=3;notes.push('nicely '+order.hue+' ✔')}else if(h>0){pts+=1;notes.push('could be more '+order.hue)}else notes.push('not '+order.hue+' at all')}
  if(order.mood){max+=3;const m=st.filter(k=>FLOWERS[k].mood.includes(order.mood)).length;if(m>=st.length*0.6&&st.length){pts+=3;notes.push(MOODS[order.mood]+' ✔')}else if(m>0){pts+=1;notes.push('not quite '+MOODS[order.mood].replace('something ','').replace('a touch of ',''))}else notes.push('wrong mood')}
  max+=2;const diff=Math.abs(st.length-order.size);if(diff<=1){pts+=2;notes.push('good size ✔')}else if(diff<=3)pts+=1;else notes.push(st.length<order.size?'too small':'too big');
  if(order.wrap){max+=1;if(B.wrap===order.wrap){pts+=1;notes.push(order.wrap+' paper ✔')}else notes.push('wrong paper')}if(order.ribbon){max+=1;if(B.ribbon===order.ribbon){pts+=1;notes.push(order.ribbon+' ribbon ✔')}else notes.push('wrong ribbon')}
  return {pts,max,notes}}
function give(){if(!B.stems.length){flash('Add some flowers first.');return}const {pts,max,notes}=score();const f=pts/max;const stars=f>=0.95?3:f>=0.7?2:f>=0.4?1:0;const cost=B.stems.reduce((a,k)=>a+FLOWERS[k].price,0);const pay=Math.round(cost*(0.8+stars*0.6))+stars*4;S.coins+=pay;S.xp+=stars*3+1;S.served++;S.n++;while(S.xp>=25*S.lvl){S.xp-=25*S.lvl;S.lvl++}
  const h='<h3>'+order.name.toUpperCase()+' '+(stars===3?'LOVES IT':stars===2?'LIKES IT':stars===1?'SHRUGS':'IS DISAPPOINTED')+'</h3><p>'+'★'.repeat(stars)+'☆'.repeat(3-stars)+' · '+notes.join(' · ')+'</p><p>'+pay+' coins.'+(S.lvl>1&&S.xp<4?' New flowers are on the bench at level '+S.lvl+'.':'')+'</p><button class="btn on" id="ok">NEXT CUSTOMER</button>';
  if(S.n>=6){S.n=0;S.day++;S.best=Math.max(S.best,S.coins)}save();show(h).then(startOrder);beep(stars?900:300,0.2,'triangle')}
let flashT=0,flashMsg='';function flash(t){flashMsg=t;flashT=2}
function show(html){return new Promise(res=>{$('overlay').innerHTML='<div class="modal">'+html+'</div>';$('overlay').classList.add('on');const b=$('ok');if(b)b.onclick=()=>{hide();res()}})}
function hide(){$('overlay').classList.remove('on');$('overlay').innerHTML=''}
function refresh(){$('sDay').textContent='Day '+S.day+' · order '+(S.n+1)+' of 6 · level '+S.lvl;$('sCoins').textContent=S.coins+' coins';
  $('stems').innerHTML=avail().map(k=>'<button class="btn" data-f="'+k+'"><span class="sw" style="background:'+FLOWERS[k].col+'"></span>'+FLOWERS[k].n.toUpperCase()+'</button>').join('');for(const b of $('stems').children)b.onclick=()=>{if(B.stems.length>=9){flash('Nine stems is plenty.');return}B.stems.push(b.dataset.f);beep(600+B.stems.length*40,0.05)};
  $('wraps').innerHTML=WRAPS.map(([k,c])=>'<button class="btn'+(B.wrap===k?' on':'')+'" data-w="'+k+'"><span class="sw" style="background:'+c+'"></span>'+k.toUpperCase()+'</button>').join('');for(const b of $('wraps').children)b.onclick=()=>{B.wrap=b.dataset.w;refresh()};
  $('ribbons').innerHTML=RIBBONS.map(([k,c])=>'<button class="btn'+(B.ribbon===k?' on':'')+'" data-r="'+k+'"><span class="sw" style="background:'+c+'"></span>'+k.toUpperCase()+'</button>').join('');for(const b of $('ribbons').children)b.onclick=()=>{B.ribbon=b.dataset.r;refresh()}}
function renderPanel(){$('panel').innerHTML='<h4>'+order.name.toUpperCase()+' ASKS FOR</h4><p>"'+order.text.charAt(0).toUpperCase()+order.text.slice(1)+'"</p><h4>HOW TO PLAY</h4><p>Tap stems to add them to the bouquet, choose the paper and ribbon, then hand it over. Customers judge the flowers they asked for, the colours and mood, the size, and the wrapping. Better bouquets pay more and unlock new flowers.</p>'}
const cv=$('c'),ctx=cv.getContext('2d');let W=800,H=450,last=0;
function resize(){const r=cv.getBoundingClientRect();W=Math.max(300,Math.floor(r.width));H=Math.max(200,Math.floor(r.height));cv.width=W;cv.height=H}addEventListener('resize',resize);resize();
function draw(){const t=performance.now()/1000;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe6f0');g.addColorStop(1,'#ffd0e0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.4)';for(let i=0;i<W;i+=40)ctx.fillRect(i,0,20,H*0.6);ctx.fillStyle='#c89060';ctx.fillRect(0,H*0.62,W,H);ctx.fillStyle='#e8b080';ctx.fillRect(0,H*0.62,W,10);
  // shelves with vases
  ctx.fillStyle='#a07050';ctx.fillRect(W*0.04,H*0.3,W*0.26,8);ctx.fillRect(W*0.7,H*0.3,W*0.26,8);if(S){const fl=Object.keys(FLOWERS);fl.forEach((k,i)=>{const x=(i<4?W*0.06:W*0.72)+(i%4)*W*0.065;const f=FLOWERS[k];ctx.fillStyle=f.lvl<=S.lvl?'#8ab0d0':'#b0b0b0';ctx.fillRect(x,H*0.18,18,H*0.12);if(f.lvl<=S.lvl)for(let k2=0;k2<3;k2++)drawFlower(k,x+9+(k2-1)*6,H*0.18-6-k2*4,0.5)})}
  if(!B)return;
  // bouquet
  const bx=W/2,by=H*0.6;const wrapCol=WRAPS.find(w=>w[0]===B.wrap)[1],ribCol=RIBBONS.find(r=>r[0]===B.ribbon)[1];
  ctx.fillStyle='#4a8a3a';ctx.lineWidth=3;ctx.strokeStyle='#4a8a3a';B.stems.forEach((k,i)=>{const n=B.stems.length;const a=-Math.PI/2+(i-(n-1)/2)*(0.9/Math.max(1,n-1))*(n>1?1:0);const len=120+((i*37)%40);ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a)*len,by+Math.sin(a)*len);ctx.stroke()});
  ctx.fillStyle=wrapCol;ctx.beginPath();ctx.moveTo(bx-70,by-40);ctx.lineTo(bx+70,by-40);ctx.lineTo(bx+22,by+90);ctx.lineTo(bx-22,by+90);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(0,0,0,0.1)';ctx.beginPath();ctx.moveTo(bx,by-40);ctx.lineTo(bx+70,by-40);ctx.lineTo(bx+22,by+90);ctx.lineTo(bx,by+90);ctx.fill();
  B.stems.forEach((k,i)=>{const n=B.stems.length;const a=-Math.PI/2+(i-(n-1)/2)*(0.9/Math.max(1,n-1))*(n>1?1:0);const len=120+((i*37)%40);drawFlower(k,bx+Math.cos(a)*len,by+Math.sin(a)*len+Math.sin(t*2+i)*2,1)});
  ctx.fillStyle=ribCol;ctx.fillRect(bx-40,by+14,80,12);ctx.beginPath();ctx.ellipse(bx-16,by+20,16,9,-0.3,0,7);ctx.ellipse(bx+16,by+20,16,9,0.3,0,7);ctx.fill();ctx.fillRect(bx-10,by+22,8,30);ctx.fillRect(bx+4,by+22,8,28);
  ctx.fillStyle='rgba(50,22,36,0.55)';ctx.fillRect(0,0,W,26);ctx.fillStyle='#ffd0e0';ctx.font='bold 13px Oswald, sans-serif';ctx.textAlign='left';ctx.fillText(flashT>0?flashMsg.toUpperCase():(B.stems.length+' STEMS · '+B.wrap.toUpperCase()+' PAPER · '+B.ribbon.toUpperCase()+' RIBBON'),150,17)}
function drawFlower(k,x,y,s){const f=FLOWERS[k];ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=f.col;if(k==='tulip'||k==='bluebell'){ctx.beginPath();ctx.moveTo(-10,6);ctx.lineTo(-8,-12);ctx.lineTo(0,-4);ctx.lineTo(8,-12);ctx.lineTo(10,6);ctx.fill()}else if(k==='lavender'){for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(i%2?3:-3,-i*5,4,0,7);ctx.fill()}}else if(k==='lily'){for(let i=0;i<6;i++){const a=i/6*Math.PI*2;ctx.beginPath();ctx.ellipse(Math.cos(a)*9,Math.sin(a)*9,5,11,a,0,7);ctx.fill()}ctx.fillStyle='#ff9a60';ctx.beginPath();ctx.arc(0,0,3,0,7);ctx.fill()}else if(k==='rose'||k==='peony'){for(let r=12;r>2;r-=3){ctx.fillStyle=r%2?f.col:shade(f.col,0.85);ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill()}}else{for(let i=0;i<8;i++){const a=i/8*Math.PI*2;ctx.beginPath();ctx.ellipse(Math.cos(a)*8,Math.sin(a)*8,5,3.5,a,0,7);ctx.fill()}ctx.fillStyle=f.centre||'#ffd040';ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill()}ctx.restore()}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.min(255,Math.round(((n>>16)&255)*f)),g=Math.min(255,Math.round(((n>>8)&255)*f)),b=Math.min(255,Math.round((n&255)*f));return 'rgb('+r+','+g+','+b+')'}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.1,(now-last)/1000||0);last=now;flashT=Math.max(0,flashT-dt);draw()}
$('bUndo').onclick=()=>{B.stems.pop()};$('bClear').onclick=()=>{B.stems=[]};$('bGive').onclick=give;
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=0.05;g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function titleScreen(){const saved=load();$('overlay').innerHTML='<div class="modal title"><h1>IRON BOUQUET</h1><div class="tag">A LITTLE FLOWER SHOP</div><p>Customers come in asking for roses and tulips, something sunny, something calm, a touch of spring. Pick the stems, choose the paper and ribbon and hand over the bouquet. The happier they are, the more they pay, and new flowers arrive on the bench as you level up.</p>'+(saved?'<button class="btn on" id="cont">CONTINUE — DAY '+saved.day+'</button>':'')+'<button class="btn" id="new" style="margin-top:6px">OPEN A NEW SHOP</button></div>';$('overlay').classList.add('on');
  const begin=st=>{S=st;hide();ac();startOrder()};if(saved)$('cont').onclick=()=>begin(saved);$('new').onclick=()=>begin(newState())}
titleScreen();requestAnimationFrame(frame);
</script></body></html>
